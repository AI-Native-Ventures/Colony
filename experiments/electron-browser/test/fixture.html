<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Colony browser proof fixture</title>
<style>body{font:18px system-ui;margin:60px;background:#f3effa;color:#171717}h1{max-width:650px;font-size:38px;letter-spacing:-1px}label{display:block;margin-top:20px}input{font:inherit;padding:12px;width:440px}button{font:inherit;padding:13px;background:#171717;color:white;border:0;border-radius:7px;margin-top:20px}#preview{padding:20px;margin-top:30px;background:#ded4f7;min-height:60px}small{display:block;margin-top:30px}</style>
<body><p>COLONY / BROWSER PROOF</p><h1>The worker and owner share this real page.</h1>
<p id="session"></p><label for="caption">Caption</label><input id="caption"><br>
<button id="preview-button">Preview draft</button><button id="signin">Remember fixture session</button>
<div id="preview" role="status">No draft prepared</div>
<label for="secret">Secret</label><input id="secret" type="password" value="fixture-secret">
<small>This is a local test page. Nothing is posted to a social network.</small>
<script>
const sessionLabel = document.getElementById('session');
sessionLabel.textContent = 'Fixture identity: ' + (localStorage.getItem('brand') || 'none');
document.getElementById('preview-button').onclick = () => { document.getElementById('preview').textContent = 'Draft ready: ' + document.getElementById('caption').value; };
document.getElementById('signin').onclick = () => { const brand = document.getElementById('caption').value; localStorage.setItem('brand', brand); document.cookie = 'fixture_brand=' + encodeURIComponent(brand) + '; Max-Age=86400; SameSite=Strict; Path=/'; sessionLabel.textContent = 'Fixture identity: ' + brand; };
</script></body></html>
