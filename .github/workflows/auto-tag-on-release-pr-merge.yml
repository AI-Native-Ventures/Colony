name: Auto-tag on Release PR Merge

# Four PR-driven release lanes share this workflow. Each uses an explicit branch
# prefix; the main chart lane also auto-detects a Chart.yaml version bump so
# a chart feature PR can publish its own new version when merged:
#
#   version-bump/<v>   → tag v<v>        → release.yml (desktop app)
#   relay-release/<v>  → tag relay-v<v>  → docker.yml (relay image)
#   chart-release/<v>  → tag chart-v<v>  → helm-chart.yml (main helm chart)
#   push-chart-release/<v> → tag push-chart-v<v> → push-gateway-helm-chart.yml
#   any internal PR that bumps deploy/charts/buzz/Chart.yaml `version`
#                       → tag chart-v<v>  → helm-chart.yml (helm chart)
#   any internal PR that bumps desktop/src-tauri/tauri.conf.json `version`
#                       → tag v<v>        → colony-desktop-release.yml
#   any internal PR that bumps crates/buzz-relay/Cargo.toml `version`
#                       → tag relay-v<v>  → docker.yml (relay image)
#
# The version-diff detection exists for the promotion model this fork runs:
# releases arrive as develop → main promotion PRs whose head branch is
# `develop`, never `version-bump/<v>`, so branch-prefix lanes alone would
# skip every real release. Bump the component version on develop, promote,
# and the merge tags itself. One merge may bump several components and
# therefore create several tags. The diff base is the merge commit's first
# parent (the previous tip of main), which holds for merge commits and
# squash merges alike.
#
# Mobile candidate tags do not come from merged PRs. Operators create immutable
# mobile-v<v>-rc.N tags directly from remote main with scripts/mobile-release.sh,
# then hand the exact tag to buzz-releases.
#
# The release-tagger App is required: only a tag it signs fires the
# consumers' `on.push.tags` triggers, and the publishers deliberately build
# nowhere else. A missing App fails the lane loudly and early rather than
# creating a tag no publisher will ever act on, which is the silent gap that
# bit relay-v0.3.0 (tag existed, no image was ever built).
#
# Release tags are created with a short-lived token from the dedicated
# release-tagger GitHub App. GitHub attributes the ref creation to that
# App, so the consumer's `on.push.tags` trigger runs normally. The workflow's
# default GITHUB_TOKEN remains read-only and is never used to create a tag.
#
# Mobile is manual-only by infosec necessity: OSS `block/buzz` CI must
# not trigger CI in the private `buzz-releases` repo. A human feeds the exact
# mobile candidate tag to the private Buildkite pipeline, which builds and
# ships mobile.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  auto-tag:
    permissions:
      # The fallback path creates the tag ref itself and then dispatches the
      # consumer, because a ref created with GITHUB_TOKEN does not fire
      # `on.push.tags`. Both need more than the read-only default.
      contents: write
      actions: write
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release lane and version
        id: release
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Explicit release branches retain their established behavior. For an
          # ordinary internal PR (promotion PRs included), publish each
          # component whose version file changed relative to the merge
          # commit's first parent, the previous tip of main.
          emit() {
            local prefix=$1 version=$2
            if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Invalid release version: '$version'"
              exit 1
            fi
            ENTRIES+=("${prefix} ${version}")
            echo "Tagging ${prefix}${version}"
          }
          ENTRIES=()
          case "$BRANCH" in
            version-bump/*)
              emit "v" "${BRANCH#version-bump/}" ;;
            relay-release/*)
              emit "relay-v" "${BRANCH#relay-release/}" ;;
            chart-release/*)
              emit "chart-v" "${BRANCH#chart-release/}" ;;
            push-chart-release/*)
              emit "push-chart-v" "${BRANCH#push-chart-release/}" ;;
            *)
              parent_sha="$(git rev-parse HEAD^)"
              old_chart="$(git show "${parent_sha}:deploy/charts/buzz/Chart.yaml" 2>/dev/null | awk '/^version:/ {print $2}')"
              new_chart="$(awk '/^version:/ {print $2}' deploy/charts/buzz/Chart.yaml)"
              if [ -n "$old_chart" ] && [ -n "$new_chart" ] && [ "$old_chart" != "$new_chart" ]; then
                emit "chart-v" "$new_chart"
              fi
              # `// empty` so a malformed file yields an empty string (skip)
              # rather than the literal "null" reaching the semver check.
              old_desktop="$(git show "${parent_sha}:desktop/src-tauri/tauri.conf.json" 2>/dev/null | jq -r '.version // empty')"
              new_desktop="$(jq -r '.version // empty' desktop/src-tauri/tauri.conf.json)"
              if [ -n "$old_desktop" ] && [ -n "$new_desktop" ] && [ "$old_desktop" != "$new_desktop" ]; then
                emit "v" "$new_desktop"
              fi
              old_relay="$(git show "${parent_sha}:crates/buzz-relay/Cargo.toml" 2>/dev/null | awk -F '"' '/^version = / {print $2; exit}')"
              new_relay="$(awk -F '"' '/^version = / {print $2; exit}' crates/buzz-relay/Cargo.toml)"
              if [ -n "$old_relay" ] && [ -n "$new_relay" ] && [ "$old_relay" != "$new_relay" ]; then
                emit "relay-v" "$new_relay"
              fi
              ;;
          esac
          if [ "${#ENTRIES[@]}" -eq 0 ]; then
            echo "No release branch or version bump — nothing to tag"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "enabled=true"
            echo "tags<<TAGS_EOF"
            printf '%s\n' "${ENTRIES[@]}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # The App is what makes this lane work at all: a tag it signs is
      # attributed to the App and therefore fires the consumers'
      # `on.push.tags` triggers, which is the only path that builds a release
      # at the tag ref. `verify-release-ref.sh` rejects a branch-backed
      # release, so there is no substitute here, and creating a tag we cannot
      # publish from would be worse than not tagging: the lane would look done
      # while no artifact was ever built.
      #
      # So its absence fails here, loudly and early, with the two ways out.
      - name: Require the release tagger App
        # The credentials are checked in the body, not in `if`: the `secrets`
        # context is not available to a step condition, and using it there
        # makes the whole workflow unparseable. GitHub then reports a failed
        # run with no jobs on every push, which is how this was found.
        if: steps.release.outputs.enabled == 'true'
        env:
          TAGS: ${{ steps.release.outputs.tags }}
          CLIENT_ID: ${{ vars.BUZZ_RELEASE_TAGGER_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.BUZZ_RELEASE_TAGGER_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "Release tagger App is configured."
            exit 0
          fi
          {
            echo "::error::Cannot tag: the release-tagger App is not configured."
            echo "::error::Set the BUZZ_RELEASE_TAGGER_CLIENT_ID repository variable and"
            echo "::error::the BUZZ_RELEASE_TAGGER_PRIVATE_KEY secret."
            echo "::error::To release without it, push each tag by hand at the release"
            echo "::error::commit, which fires the publisher exactly as the App would:"
            echo "$TAGS" | while read -r PREFIX VERSION; do
              [ -z "$PREFIX" ] && continue
              echo "::error::  git tag -a ${PREFIX}${VERSION} <sha> -m ${PREFIX}${VERSION} && git push origin ${PREFIX}${VERSION}"
            done
          } >&2
          exit 1

      - name: Create release tagger token
        if: steps.release.outputs.enabled == 'true'
        id: release-tagger
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BUZZ_RELEASE_TAGGER_CLIENT_ID }}
          private-key: ${{ secrets.BUZZ_RELEASE_TAGGER_PRIVATE_KEY }}
          permission-contents: write

      - name: Create and push tags
        if: steps.release.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.release-tagger.outputs.token }}
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          set -euo pipefail
          while read -r PREFIX VERSION; do
            [ -z "$PREFIX" ] && continue
            TAG="${PREFIX}${VERSION}"
            # Check gh's exit status, not its output. A missing ref returns a 404
            # JSON body on stdout, which must not be mistaken for an existing tag.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
              EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
              if [ "$EXISTING_SHA" = "$GITHUB_SHA" ]; then
                echo "Tag $TAG already exists at $GITHUB_SHA — skipping tag creation"
                continue
              else
                echo "::error::Tag $TAG already exists at $EXISTING_SHA (expected $GITHUB_SHA)"
                exit 1
              fi
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" \
              --silent
            echo "Created $TAG at $GITHUB_SHA"
          done <<< "$TAGS"
