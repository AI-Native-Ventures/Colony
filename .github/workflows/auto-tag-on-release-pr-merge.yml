name: Auto-tag on Release PR Merge

# Four PR-driven release lanes share this workflow. Each uses an explicit branch
# prefix; the main chart lane also auto-detects a Chart.yaml version bump so
# a chart feature PR can publish its own new version when merged:
#
#   version-bump/<v>   → tag v<v>        → release.yml (desktop app)
#   relay-release/<v>  → tag relay-v<v>  → docker.yml (relay image)
#   chart-release/<v>  → tag chart-v<v>  → helm-chart.yml (main helm chart)
#   push-chart-release/<v> → tag push-chart-v<v> → push-gateway-helm-chart.yml
#   any internal PR that bumps deploy/charts/buzz/Chart.yaml `version`
#                       → tag chart-v<v>  → helm-chart.yml (helm chart)
#
# Mobile candidate tags do not come from merged PRs. Operators create immutable
# mobile-v<v>-rc.N tags directly from remote main with scripts/mobile-release.sh,
# then hand the exact tag to buzz-releases.
#
# The release-tagger App is optional. Where it is configured, a tag it signs is
# attributed to the App and fires the consumers' `on.push.tags` triggers
# normally. Where it is not (a fork without those credentials), the lane falls
# back to GITHUB_TOKEN and then dispatches the consumer explicitly, because a
# ref created with GITHUB_TOKEN deliberately does not trigger further
# workflows. Without that second half the lane looks green while publishing
# nothing: the tag exists, no artifact is ever built, and the gap surfaces only
# when someone goes looking for an image that was never made. That is exactly
# what happened to relay-v0.3.0, which had to be tagged by hand.
#
# Release tags are created with a short-lived token from the dedicated
# buzz-release-bot GitHub App. GitHub attributes the ref creation to that
# App, so the consumer's `on.push.tags` trigger runs normally. The workflow's
# default GITHUB_TOKEN remains read-only and is never used to create a tag.
#
# Mobile is manual-only by infosec necessity: OSS `block/buzz` CI must
# not trigger CI in the private `buzz-releases` repo. A human feeds the exact
# mobile candidate tag to the private Buildkite pipeline, which builds and
# ships mobile.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  auto-tag:
    permissions:
      # The fallback path creates the tag ref itself and then dispatches the
      # consumer, because a ref created with GITHUB_TOKEN does not fire
      # `on.push.tags`. Both need more than the read-only default.
      contents: write
      actions: write
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release lane and version
        id: release
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Explicit release branches retain their established behavior. For an
          # ordinary internal PR, publish only when Chart.yaml itself changed
          # and its version differs from the PR's base commit.
          case "$BRANCH" in
            version-bump/*)
              VERSION="${BRANCH#version-bump/}"
              TAG_PREFIX="v" ;;
            relay-release/*)
              VERSION="${BRANCH#relay-release/}"
              TAG_PREFIX="relay-v" ;;
            chart-release/*)
              VERSION="${BRANCH#chart-release/}"
              TAG_PREFIX="chart-v" ;;
            push-chart-release/*)
              VERSION="${BRANCH#push-chart-release/}"
              TAG_PREFIX="push-chart-v" ;;
            *)
              parent_sha="$(git rev-parse HEAD^)"
              old_version="$(git show "${parent_sha}:deploy/charts/buzz/Chart.yaml" 2>/dev/null | awk '/^version:/ {print $2}')"
              VERSION="$(awk '/^version:/ {print $2}' deploy/charts/buzz/Chart.yaml)"
              if [ -z "$old_version" ] || [ -z "$VERSION" ] || [ "$old_version" = "$VERSION" ]; then
                echo "No release branch or chart version bump — nothing to tag"
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              TAG_PREFIX="chart-v" ;;
          esac
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid release version: '$VERSION'"
            exit 1
          fi
          {
            echo "enabled=true"
            echo "tag=${TAG_PREFIX}${VERSION}"
            echo "prefix=${TAG_PREFIX}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Tagging ${TAG_PREFIX}${VERSION}"

      # The release-tagger App is optional. Upstream configures it so that a
      # tag it creates is attributed to the App and therefore fires the
      # consumers' `on.push.tags` triggers. A fork without those credentials
      # must still be able to release, so its absence falls back below rather
      # than failing the whole lane.
      - name: Create release tagger token
        if: >
          steps.release.outputs.enabled == 'true' &&
          vars.BUZZ_RELEASE_TAGGER_CLIENT_ID != ''
        id: release-tagger
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BUZZ_RELEASE_TAGGER_CLIENT_ID }}
          private-key: ${{ secrets.BUZZ_RELEASE_TAGGER_PRIVATE_KEY }}
          permission-contents: write

      - name: Create and push tag
        if: steps.release.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.release-tagger.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Check gh's exit status, not its output. A missing ref returns a 404
          # JSON body on stdout, which must not be mistaken for an existing tag.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
            if [ "$EXISTING_SHA" = "$GITHUB_SHA" ]; then
              echo "Tag $TAG already exists at $GITHUB_SHA — skipping tag creation"
              exit 0
            else
              echo "::error::Tag $TAG already exists at $EXISTING_SHA (expected $GITHUB_SHA)"
              exit 1
            fi
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA" \
            --silent

      # A tag created with GITHUB_TOKEN deliberately does not trigger further
      # workflows, which is the whole reason upstream signs it with an App. So
      # when the fallback created the tag, the consumer has to be started
      # explicitly, using the same rescue dispatch each one already documents.
      #
      # Without this the lane looks green while publishing nothing: the tag
      # exists, no image or chart is ever built, and the gap is only noticed
      # when someone goes looking for an artifact that was never made.
      - name: Start the consumer when the tag could not trigger it
        if: >
          steps.release.outputs.enabled == 'true' &&
          steps.release-tagger.outcome == 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: ${{ steps.release.outputs.prefix }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          case "$PREFIX" in
            "v")             WORKFLOW="release.yml" ;               ARGS=(-f version="$VERSION") ;;
            "relay-v")       WORKFLOW="docker.yml" ;                ARGS=(-f version="$VERSION") ;;
            "chart-v")       WORKFLOW="helm-chart.yml" ;            ARGS=(-f version="$VERSION" -f ref="$TAG") ;;
            "push-chart-v")  WORKFLOW="push-gateway-helm-chart.yml" ; ARGS=(-f version="$VERSION" -f ref="$TAG") ;;
            *)
              echo "::error::No consumer known for tag prefix '$PREFIX'"
              exit 1 ;;
          esac

          echo "Tag $TAG was created without the release-tagger App, so it"
          echo "cannot trigger $WORKFLOW on its own. Dispatching it directly."
          gh workflow run "$WORKFLOW" --ref main "${ARGS[@]}"
