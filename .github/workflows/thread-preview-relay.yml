name: Thread preview relay verification
on:
  push:
    branches: [codex/thread-preview-reset]
    paths:
      - .github/workflows/thread-preview-relay.yml
      - desktop/tests/e2e/blocks-live.spec.ts
permissions:
  contents: read
concurrency:
  group: thread-preview-relay-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  BUZZ_TEST_POSTGRES_PASSWORD: buzz_dev
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
jobs:
  blocks-live-gate:
    # Runs the Blocks Gate C live loop (protocol kinds 30178/40010-40012)
    # against a real relay/CLI/ACP tuple exactly as scripts/prove-blocks.sh
    # proves it locally: isolated Postgres/Redis/MinIO under the buzz-harness
    # compose project, deterministic ACP fixture, real desktop E2E bundle, and
    # the blocks-live Playwright spec. Reusing the script keeps CI and the
    # local gate proving the same thing; tmux is installed below so the
    # script's process supervision runs unchanged.
    #
    # Runner/cost: GitHub-hosted ubuntu-latest is free on this public repo
    # (standard runners are free and unlimited for public repositories), so
    # this job adds no billing. The self-hosted colony-mac-builder runner is
    # the dev machine itself, where the isolated harness ports (3030/5471/6471)
    # are owned by other work; it must not host this gate. If the repo is ever
    # made private, re-evaluate: a cold run is ~30-50 min, which would bill
    # roughly $2.40-4.00 at $0.08/min on ubuntu-latest.
    name: Blocks Live Gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
      - name: Activate Hermit
        id: activate-hermit
        continue-on-error: true
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        with:
          cache: "true"
      - name: Retry Hermit activation
        if: steps.activate-hermit.outcome == 'failure'
        run: ./scripts/ci-activate-hermit.sh
      # Restore only. A save here ran on every pull request and wrote a 21 MB
      # copy scoped to that pull request's own ref, which no other run can
      # read: the cache store held twenty-odd identical copies of the same
      # hash. Tauri Cache Warm writes the one copy on develop that every
      # branch restores from. A miss still falls back to downloading the
      # archive, so this is a speed path, not a correctness one.
      - name: Restore sherpa-onnx native archive
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Prepare sherpa-onnx native archive
        run: ./scripts/ci-prepare-sherpa-onnx.sh
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install Tauri and tmux dependencies (Linux)
        run: |
          scripts/ci-apt-install.sh \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            tmux \
            wget
      - name: Get pnpm store directory
        id: pnpm-cache
        run: ./scripts/ci-pnpm-store-path.sh
      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install desktop dependencies
        run: just desktop-install-ci
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(cd desktop && node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd desktop && pnpm exec playwright install chromium
      - name: Install Playwright system dependencies
        run: cd desktop && ../scripts/ci-playwright-deps.sh chromium
      - name: Create Tauri sidecar placeholders
        # prove-blocks.sh runs `cargo test --manifest-path
        # desktop/src-tauri/Cargo.toml agent_proposal`, and Tauri's build.rs
        # validates externalBin at compile time. The just recipe that every
        # other Tauri CI step depends on creates empty placeholders for the
        # host triple; nothing executes them, so stubs are sufficient.
        run: just _ensure-sidecar-stubs
      - name: Run the Blocks live gate
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: ./scripts/prove-blocks.sh
      - name: Upload Blocks gate evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blocks-live-gate-artifacts
          path: |
            desktop/test-results/blocks
            desktop/playwright-report
            /tmp/blocks-relay-*.log
            /tmp/blocks-acp-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save pnpm store cache
        if: github.event_name == 'push'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

