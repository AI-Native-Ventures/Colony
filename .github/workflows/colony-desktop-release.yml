name: Colony desktop release

# Builds the macOS desktop dmg at a v<version> tag and publishes it to the
# public AI-Native-Ventures/colony-releases repo, whose
# /releases/latest/download URL the marketing site's download button points
# at. Exists because upstream's release.yml is gated to
# `github.repository == 'block/buzz'` and its signing pipeline needs Block's
# certificates; this fork ships an ad-hoc-signed Apple Silicon dmg instead.
#
# The build runs on a self-hosted Mac runner (labels: self-hosted, macOS,
# colony-builder). Hosted macOS runners would work now that the repo is
# public, but a release rebuilds the whole Rust workspace cold every time;
# the self-hosted runner's persistent workspace keeps the cargo cache warm,
# which is the difference between a ~20 minute release and an hour.
#
# It also publishes the auto-update loop: the app polls latest.json on the
# rolling colony-desktop-latest release, and this workflow signs the updater
# archive, uploads it, and rewrites that manifest. The endpoint is compiled
# into each build, so it can never change without stranding installs.
#
# Normal releases arrive through the push:tags trigger. The tag is created
# by auto-tag-on-release-pr-merge.yml when a merged PR bumps the version in
# desktop/src-tauri/tauri.conf.json. workflow_dispatch is the manual rescue
# path for re-running publication at an existing immutable tag;
# verify-release-ref.sh rejects any run whose ref, checked-out HEAD, and tag
# do not resolve to one commit, so there is no caller-selected source ref.

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version e.g. 0.7.0 (no v prefix) — for tag rescue dispatch"
        required: true

permissions:
  contents: read

# Never cancel a tag build mid-publish.
concurrency:
  group: colony-desktop-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The manifest the shipped app polls. It lives on a rolling release tag so
  # the URL never changes; every release clobbers latest.json there. Changing
  # this string strands every already-installed copy, because the endpoint is
  # compiled into the binary at build time.
  UPDATER_ENDPOINT: https://github.com/AI-Native-Ventures/colony-releases/releases/download/colony-desktop-latest/latest.json

jobs:
  build-and-publish:
    if: github.repository == 'AI-Native-Ventures/Colony'
    runs-on: [self-hosted, macOS, colony-builder]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release ref
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          scripts/verify-release-ref.sh v "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build sidecar binaries
        run: |
          . ./bin/activate-hermit
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --target aarch64-apple-darwin \
            -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          scripts/bundle-sidecars.sh aarch64-apple-darwin

      - name: Check sidecars are real binaries
        # The build recipe `touch`es sidecar paths, which creates 0-byte stubs
        # when the staging step above was skipped or failed silently. A dmg
        # with stub sidecars installs fine and then cannot launch any agent,
        # so refuse to continue with any suspiciously small sidecar.
        run: |
          for bin in buzz-acp buzz-agent buzz-dev-mcp git-credential-nostr buzz; do
            f="desktop/src-tauri/binaries/${bin}-aarch64-apple-darwin"
            size=$(stat -f %z "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 500000 ]; then
              echo "::error::Sidecar $f is ${size} bytes — a stub, not a real binary"
              exit 1
            fi
          done

      # Writes desktop/src-tauri/tauri.release.conf.json: the updater pubkey
      # and endpoint, plus createUpdaterArtifacts so the build emits the
      # .app.tar.gz and its signature. It is a delta merged over
      # tauri.conf.json, so the ad-hoc signingIdentity in the base config
      # still applies. The build also needs the signing key in the
      # environment: without it Tauri emits the archive unsigned and every
      # client rejects the update.
      - name: Write the release config
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
        run: |
          . ./bin/activate-hermit
          cd desktop && node scripts/build-release-config.mjs

      - name: Build desktop app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          . ./bin/activate-hermit
          export PATH="$HOME/.cargo/bin:$PATH"
          just desktop-release-build aarch64-apple-darwin src-tauri/tauri.release.conf.json

      - name: Verify the bundle
        run: |
          BUNDLE=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          APP="$BUNDLE/macos/Colony.app"
          DMG="$BUNDLE/dmg/Colony_${VERSION}_aarch64.dmg"
          test -d "$APP" || { echo "::error::Missing $APP"; exit 1; }
          test -f "$DMG" || { echo "::error::Missing $DMG"; exit 1; }
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          if [ "$PLIST_VERSION" != "$VERSION" ]; then
            echo "::error::Built app reports version $PLIST_VERSION, expected $VERSION"
            exit 1
          fi
          codesign --verify --deep --strict "$APP"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Locate the updater archive
        # Tauri writes Colony.app.tar.gz next to the .app and signs it with the
        # updater key. An unsigned or missing archive means the build silently
        # lost TAURI_SIGNING_PRIVATE_KEY, which would publish a manifest no
        # client can verify, so fail here rather than ship it.
        run: |
          set -euo pipefail
          BUNDLE=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          ARCHIVE=$(find "$BUNDLE/macos" -name '*.app.tar.gz' ! -name '*.sig' -type f | head -1)
          if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
            echo "::error::No updater archive in $BUNDLE/macos — is createUpdaterArtifacts on?"
            exit 1
          fi
          if [ ! -s "${ARCHIVE}.sig" ]; then
            echo "::error::${ARCHIVE}.sig missing or empty — the build had no signing key"
            exit 1
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "ARCHIVE_SIG=${ARCHIVE}.sig" >> "$GITHUB_ENV"

      # The token is minted after the long build so its one-hour lifetime
      # cannot expire before the upload. Same App as the release tagger,
      # scoped down to colony-releases only.
      - name: Create release publisher token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BUZZ_RELEASE_TAGGER_CLIENT_ID }}
          private-key: ${{ secrets.BUZZ_RELEASE_TAGGER_PRIVATE_KEY }}
          owner: AI-Native-Ventures
          repositories: colony-releases
          permission-contents: write

      - name: Publish to colony-releases
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          STAGING=$(mktemp -d)
          # The site's download button fetches the unversioned asset name via
          # /releases/latest/download/Colony_aarch64.dmg, so every release
          # must carry BOTH names.
          cp "$DMG" "$STAGING/Colony_${VERSION}_aarch64.dmg"
          cp "$DMG" "$STAGING/Colony_aarch64.dmg"
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          {
            echo "Colony ${VERSION} for macOS (Apple Silicon)."
            echo
            if [ -n "$PREV" ]; then
              echo "Changes since ${PREV}:"
              git log --no-merges --pretty='- %s' "${PREV}..${TAG}"
            else
              echo "Recent changes:"
              git log --no-merges --pretty='- %s' -25 "${TAG}"
            fi
          } > "$STAGING/notes.md"
          if ! gh release view "$TAG" --repo AI-Native-Ventures/colony-releases >/dev/null 2>&1; then
            gh release create "$TAG" --repo AI-Native-Ventures/colony-releases \
              --title "Colony ${VERSION}" --notes-file "$STAGING/notes.md"
          fi
          cp "$ARCHIVE" "$STAGING/Colony_${VERSION}_aarch64.app.tar.gz"
          gh release upload "$TAG" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/Colony_${VERSION}_aarch64.dmg" "$STAGING/Colony_aarch64.dmg" \
            "$STAGING/Colony_${VERSION}_aarch64.app.tar.gz"

      # The auto-update loop. The app polls one fixed URL, so the manifest
      # lives on a rolling tag that every release overwrites, while the
      # archive it points at keeps its version in the filename: a client that
      # cached an older manifest then downloads the archive that manifest was
      # signed for, instead of a newer archive its signature cannot verify.
      - name: Publish the update manifest
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          ROLLING=colony-desktop-latest
          STAGING=$(mktemp -d)
          ARCHIVE_NAME="Colony_${VERSION}_aarch64.app.tar.gz"
          cp "$ARCHIVE" "$STAGING/$ARCHIVE_NAME"
          ARCHIVE_URL="https://github.com/AI-Native-Ventures/colony-releases/releases/download/${ROLLING}/${ARCHIVE_NAME}"

          desktop/scripts/generate-oss-latest-json.sh "$VERSION" \
            "darwin-aarch64:${ARCHIVE_SIG}:${ARCHIVE_URL}" > "$STAGING/latest.json"

          if ! gh release view "$ROLLING" --repo AI-Native-Ventures/colony-releases >/dev/null 2>&1; then
            gh release create "$ROLLING" --repo AI-Native-Ventures/colony-releases \
              --prerelease --title "Colony auto-update manifest" \
              --notes "Rolling target for the desktop auto-updater. Do not download from here; use the versioned release."
          fi
          # Archive first: a manifest that references an asset nobody has
          # uploaded yet turns every client's update check into a 404.
          gh release upload "$ROLLING" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/$ARCHIVE_NAME"
          gh release upload "$ROLLING" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/latest.json"

      - name: Verify the update manifest
        run: |
          set -euo pipefail
          MANIFEST=$(curl -sL "$UPDATER_ENDPOINT")
          GOT_VERSION=$(echo "$MANIFEST" | jq -r '.version')
          GOT_URL=$(echo "$MANIFEST" | jq -r '.platforms["darwin-aarch64"].url')
          GOT_SIG=$(echo "$MANIFEST" | jq -r '.platforms["darwin-aarch64"].signature')
          if [ "$GOT_VERSION" != "$VERSION" ]; then
            echo "::error::Manifest says version $GOT_VERSION, expected $VERSION"
            exit 1
          fi
          if [ "$GOT_SIG" != "$(cat "$ARCHIVE_SIG")" ]; then
            echo "::error::Manifest signature does not match the signature this build produced"
            exit 1
          fi
          EXPECTED=$(stat -f %z "$ARCHIVE")
          for attempt in 1 2 3 4 5; do
            SERVED=$(curl -sIL "$GOT_URL" | grep -i '^content-length:' | tail -1 | awk '{print $2}' | tr -d '\r')
            if [ "${SERVED:-0}" = "$EXPECTED" ]; then
              echo "Manifest and archive agree: v${VERSION}, ${SERVED} bytes"
              exit 0
            fi
            echo "Attempt $attempt: archive served ${SERVED:-none} bytes, expected $EXPECTED; retrying"
            sleep 10
          done
          echo "::error::The archive the manifest points at is not the one this build produced"
          exit 1

      - name: Verify the public download
        run: |
          set -euo pipefail
          EXPECTED=$(stat -f %z "$DMG")
          URL="https://github.com/AI-Native-Ventures/colony-releases/releases/latest/download/Colony_aarch64.dmg"
          for attempt in 1 2 3 4 5; do
            GOT=$(curl -sIL "$URL" | grep -i '^content-length:' | tail -1 | awk '{print $2}' | tr -d '\r')
            if [ "${GOT:-0}" = "$EXPECTED" ]; then
              echo "latest/download serves the new dmg ($GOT bytes)"
              exit 0
            fi
            echo "Attempt $attempt: got '${GOT:-none}' bytes, expected $EXPECTED; retrying"
            sleep 10
          done
          echo "::error::latest/download/Colony_aarch64.dmg does not serve the freshly published dmg"
          exit 1
