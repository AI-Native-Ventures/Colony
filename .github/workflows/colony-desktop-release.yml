name: Colony desktop release

# macOS is the stable Electron app, explicitly ad-hoc signed (not notarized).
# Windows retains the established Tauri NSIS lane until Electron isolation is
# proven there. Both preserve the existing signed updater manifest contract.
# Updater signing stays mandatory; Apple signing is a separate reviewed mode.
# Publish only from the immutable v<version> tag; credential-only dispatches
# may use a review branch and cannot run any publisher job.

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version e.g. 0.7.0 (no v prefix) — must match the v<version> tag this run is dispatched from"
        required: true
      platform:
        description: "Which platform(s) to build and publish"
        type: choice
        options:
          - macos
          - windows
          - both
        default: macos
      preflight_only:
        description: "Check credential availability only; do not build, sign, tag or publish"
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a tag build mid-publish.
concurrency:
  group: colony-desktop-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The manifest the shipped app polls. It lives on a rolling release tag so
  # the URL never changes; every release rewrites latest.json there, each
  # platform merging its own entry. Changing this string strands every
  # already-installed copy, because the endpoint is compiled into the binary
  # at build time.
  UPDATER_ENDPOINT: https://github.com/AI-Native-Ventures/colony-releases/releases/download/colony-desktop-latest/latest.json

  # These are compile-time provisioning defaults for the packaged Colony app.
  # Keep them at workflow scope so the macOS and Windows build steps cannot
  # silently drift onto different relays (or back to the desktop development
  # default). The public build must NOT auto-connect this root relay: a fresh
  # identity is not a member there yet and must reach community creation first.
  # Explicit owner-approved distribution policy; never infer from missing secrets.
  COLONY_MACOS_SIGNING: ad-hoc
  COLONY_PRODUCTION_RELAY_WS_URL: wss://relay.colony.ainative.ventures
  COLONY_PRODUCTION_RELAY_HTTP_URL: https://relay.colony.ainative.ventures

jobs:
  preflight:
    name: Verify production release credentials
    if: github.repository == 'AI-Native-Ventures/Colony'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Require signing and publisher credentials
        env:
          RELEASE_MACOS: ${{ github.event_name == 'push' || inputs.platform != 'windows' }}
          COLONY_APPLE_CERTIFICATE_P12: ${{ secrets.COLONY_APPLE_CERTIFICATE_P12 }}
          COLONY_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.COLONY_APPLE_CERTIFICATE_PASSWORD }}
          COLONY_APPLE_API_KEY: ${{ secrets.COLONY_APPLE_API_KEY }}
          COLONY_APPLE_API_KEY_ID: ${{ vars.COLONY_APPLE_API_KEY_ID }}
          COLONY_APPLE_API_ISSUER: ${{ vars.COLONY_APPLE_API_ISSUER }}
          COLONY_APPLE_SIGNING_IDENTITY: ${{ vars.COLONY_APPLE_SIGNING_IDENTITY }}
          COLONY_APPLE_TEAM_ID: ${{ vars.COLONY_APPLE_TEAM_ID }}
          BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.BUZZ_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          BUZZ_RELEASE_TAGGER_CLIENT_ID: ${{ vars.BUZZ_RELEASE_TAGGER_CLIENT_ID }}
          BUZZ_RELEASE_TAGGER_PRIVATE_KEY: ${{ secrets.BUZZ_RELEASE_TAGGER_PRIVATE_KEY }}
        run: bash desktop/scripts/electron-release-preflight.sh

  publish-macos:
    name: Publish Electron macOS (Apple Silicon)
    needs: [preflight]
    if: "!inputs.preflight_only && github.repository == 'AI-Native-Ventures/Colony' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'macos' || inputs.platform == 'both')))"
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release ref
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          scripts/verify-release-ref.sh v "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          shared-key: electron-beta-release
      - name: Install dependencies
        run: just desktop-install-ci

      - name: Install temporary Apple signing credentials
        if: env.COLONY_MACOS_SIGNING == 'developer-id'
        env:
          COLONY_APPLE_CERTIFICATE_P12: ${{ secrets.COLONY_APPLE_CERTIFICATE_P12 }}
          COLONY_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.COLONY_APPLE_CERTIFICATE_PASSWORD }}
          COLONY_APPLE_API_KEY_CONTENT: ${{ secrets.COLONY_APPLE_API_KEY }}
        run: bash desktop/scripts/electron-signing-keychain.sh install

      - name: Build desktop app
        env:
          BUZZ_RELAY_URL: ${{ env.COLONY_PRODUCTION_RELAY_WS_URL }}
          BUZZ_RELAY_HTTP: ${{ env.COLONY_PRODUCTION_RELAY_HTTP_URL }}
          BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
          COLONY_APPLE_SIGNING_IDENTITY: ${{ vars.COLONY_APPLE_SIGNING_IDENTITY }}
          COLONY_APPLE_TEAM_ID: ${{ vars.COLONY_APPLE_TEAM_ID }}
          COLONY_APPLE_API_KEY_ID: ${{ vars.COLONY_APPLE_API_KEY_ID }}
          COLONY_APPLE_API_ISSUER: ${{ vars.COLONY_APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          unset BUZZ_BUILD_AUTO_CONNECT_DEFAULT_RELAY
          unset BUZZ_DESKTOP_BUILD_AUTO_CONNECT_DEFAULT_RELAY
          SIGNING_ARGS=()
          if [ "$COLONY_MACOS_SIGNING" = ad-hoc ]; then SIGNING_ARGS+=(--ad-hoc); fi
          pnpm --dir desktop electron:package --production "${SIGNING_ARGS[@]}"

      - name: Verify packaged runtime and prepare signed update archive
        env:
          COLONY_APPLE_TEAM_ID: ${{ vars.COLONY_APPLE_TEAM_ID }}
          BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.BUZZ_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash desktop/scripts/electron-release-assets.sh

      - name: Remove temporary Apple signing credentials
        if: always() && env.COLONY_MACOS_SIGNING == 'developer-id'
        run: bash desktop/scripts/electron-signing-keychain.sh cleanup

      # The token is minted after the long build so its one-hour lifetime
      # cannot expire before the upload. Same App as the release tagger,
      # scoped down to colony-releases only.
      - name: Create release publisher token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BUZZ_RELEASE_TAGGER_CLIENT_ID }}
          private-key: ${{ secrets.BUZZ_RELEASE_TAGGER_PRIVATE_KEY }}
          owner: AI-Native-Ventures
          repositories: colony-releases
          permission-contents: write

      - name: Publish to colony-releases
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          STAGING=$(mktemp -d)
          # The site's download button fetches the unversioned asset name via
          # /releases/latest/download/Colony_aarch64.dmg, so every release
          # must carry BOTH names.
          cp "$DMG" "$STAGING/Colony_${VERSION}_aarch64.dmg"
          cp "$DMG" "$STAGING/Colony_aarch64.dmg"
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          {
            echo "Colony ${VERSION} for macOS (Apple Silicon) and Windows (unsigned NSIS)."
            echo
            if [ "$COLONY_MACOS_SIGNING" = ad-hoc ]; then
              echo "Mac: ad-hoc signed, without Apple Developer signing or notarization. Updates retain Colony signature verification."
              echo "If macOS blocks the app after opening it, use System Settings → Privacy & Security → Open Anyway for this Colony download."
            else
              echo "Mac: signed with Developer ID and notarized."
            fi
            echo "Source: https://github.com/AI-Native-Ventures/Colony/tree/${GITHUB_SHA}"
            echo
            if [ -n "$PREV" ]; then
              echo "Changes since ${PREV}:"
              git log --no-merges --pretty='- %s' "${PREV}..${TAG}"
            else
              echo "Recent changes:"
              git log --no-merges --pretty='- %s' -25 "${TAG}"
            fi
          } > "$STAGING/notes.md"
          if ! gh release view "$TAG" --repo AI-Native-Ventures/colony-releases >/dev/null 2>&1; then
            gh release create "$TAG" --repo AI-Native-Ventures/colony-releases \
              --title "Colony ${VERSION}" --notes-file "$STAGING/notes.md"
          fi
          gh release edit "$TAG" --repo AI-Native-Ventures/colony-releases --notes-file "$STAGING/notes.md"
          cp "$ARCHIVE" "$STAGING/Colony_${VERSION}_aarch64.app.tar.gz"
          cp "$ARCHIVE_SIG" "$STAGING/Colony_${VERSION}_aarch64.app.tar.gz.sig"
          (cd "$STAGING" && shasum -a 256 "Colony_${VERSION}_aarch64.dmg" "Colony_${VERSION}_aarch64.app.tar.gz") > "$STAGING/Colony_${VERSION}_macos_SHA256SUMS.txt"
          gh release upload "$TAG" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/Colony_${VERSION}_aarch64.dmg" "$STAGING/Colony_aarch64.dmg" \
            "$STAGING/Colony_${VERSION}_aarch64.app.tar.gz" \
            "$STAGING/Colony_${VERSION}_aarch64.app.tar.gz.sig" "$STAGING/Colony_${VERSION}_macos_SHA256SUMS.txt"

      # The auto-update loop. The app polls one fixed URL, so the manifest
      # lives on a rolling tag that every release overwrites, while the
      # archive it points at keeps its version in the filename: a client that
      # cached an older manifest then downloads the archive that manifest was
      # signed for, instead of a newer archive its signature cannot verify.
      - name: Publish the archive and this platform's manifest fragment
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          ROLLING=colony-desktop-latest
          STAGING=$(mktemp -d)
          ARCHIVE_NAME="Colony_${VERSION}_aarch64.app.tar.gz"
          cp "$ARCHIVE" "$STAGING/$ARCHIVE_NAME"
          ARCHIVE_URL="https://github.com/AI-Native-Ventures/colony-releases/releases/download/${ROLLING}/${ARCHIVE_NAME}"

          # This job no longer writes latest.json. Both platform jobs used to
          # read the manifest, merge their own entry, and upload the result,
          # which is a read-modify-write race on one asset: on v0.11.8 the
          # Windows job read before this job's upload landed and wrote after
          # it, erasing the darwin entry, and every Mac client's update check
          # failed with "None of the fallback platforms were found". Reading
          # through the API rather than the CDN narrowed that window but could
          # not close it. Each platform now publishes a fragment under a
          # filename only it writes, and publish-manifest composes latest.json
          # exactly once.
          jq -n \
            --arg version "$VERSION" \
            --arg key "darwin-aarch64" \
            --arg signature "$(cat "$ARCHIVE_SIG")" \
            --arg url "$ARCHIVE_URL" \
            '{version: $version, key: $key, signature: $signature, url: $url}' \
            > "$STAGING/fragment-darwin-aarch64.json"

          if ! gh release view "$ROLLING" --repo AI-Native-Ventures/colony-releases >/dev/null 2>&1; then
            gh release create "$ROLLING" --repo AI-Native-Ventures/colony-releases \
              --prerelease --title "Colony auto-update manifest" \
              --notes "Rolling target for the desktop auto-updater. Do not download from here; use the versioned release."
          fi
          # Archive first: a fragment naming an asset nobody has uploaded yet
          # would let the manifest job publish a 404.
          gh release upload "$ROLLING" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/$ARCHIVE_NAME"
          gh release upload "$ROLLING" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/fragment-darwin-aarch64.json"

      - name: Verify the public download
        run: |
          set -euo pipefail
          EXPECTED=$(shasum -a 256 "$DMG" | cut -d " " -f1)
          DOWNLOADED="$RUNNER_TEMP/colony-public-download.dmg"
          URL="https://github.com/AI-Native-Ventures/colony-releases/releases/latest/download/Colony_aarch64.dmg"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error "$URL" -o "$DOWNLOADED"; then
              GOT=$(shasum -a 256 "$DOWNLOADED" | cut -d ' ' -f1)
              if [ "$GOT" = "$EXPECTED" ]; then
                echo "latest/download serves the exact published dmg (sha256 $GOT)"
                exit 0
              fi
            fi
            echo "Attempt $attempt: public dmg hash differs or is not available yet; retrying"
            sleep 10
          done
          echo "::error::latest/download/Colony_aarch64.dmg does not serve the freshly published dmg"
          exit 1

  publish-windows:
    name: Publish Windows (NSIS, unsigned)
    needs: [preflight]
    if: "!inputs.preflight_only && github.repository == 'AI-Native-Ventures/Colony' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'windows' || inputs.platform == 'both')))"
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release ref
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          scripts/verify-release-ref.sh v "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Hosted Windows has no hermit: MSVC comes from the runner image and
      # rust-toolchain.toml (1.95.0) is honored by the toolchain action.
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          # Disable dependency caching: a writable cache in this release
          # workflow (contents: write, feeds a signed installer) is a
          # poisoning vector. pnpm install runs uncached below.
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      # Same release config the Mac job writes: the updater pubkey and
      # endpoint plus createUpdaterArtifacts, so the NSIS build emits the
      # installer signature the manifest needs.
      - name: Write the release config
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
        run: |
          cd desktop && node scripts/build-release-config.mjs

      - name: Build sidecar binaries
        run: |
          cargo build --release --target "$TARGET" \
            -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          scripts/bundle-sidecars.sh "$TARGET"

      - name: Check sidecars are real binaries
        # Same stub guard as the Mac job: an installer with stub sidecars
        # installs fine and then cannot launch any agent.
        run: |
          for bin in buzz-acp buzz-agent buzz-dev-mcp git-credential-nostr buzz; do
            f="desktop/src-tauri/binaries/${bin}-${TARGET}.exe"
            size=$(stat -c %s "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 500000 ]; then
              echo "::error::Sidecar $f is ${size} bytes — a stub, not a real binary"
              exit 1
            fi
          done

      # No mesh-llm feature: the mesh runtime is macOS-only (Metal) and is
      # not compiled or tested for Windows in CI.
      - name: Build Windows NSIS installer (unsigned)
        env:
          # Keep the Windows artifact on the same production relay contract as
          # macOS; these are compiled by desktop/src-tauri/build.rs.
          BUZZ_RELAY_URL: ${{ env.COLONY_PRODUCTION_RELAY_WS_URL }}
          BUZZ_RELAY_HTTP: ${{ env.COLONY_PRODUCTION_RELAY_HTTP_URL }}
          BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          unset BUZZ_BUILD_AUTO_CONNECT_DEFAULT_RELAY
          unset BUZZ_DESKTOP_BUILD_AUTO_CONNECT_DEFAULT_RELAY
          cd desktop && pnpm tauri build --verbose --target "$TARGET" --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Verify the built app version
        shell: pwsh
        run: |
          $bin = "desktop/src-tauri/target/$env:TARGET/release/buzz-desktop.exe"
          if (-not (Test-Path $bin)) { Write-Error "Missing $bin"; exit 1 }
          $fileVersion = (Get-Item $bin).VersionInfo.FileVersion
          $normalized = ($fileVersion -split '\.')[0..2] -join '.'
          if ($normalized -ne $env:VERSION) {
            Write-Error "Built app reports version $fileVersion, expected $env:VERSION"
            exit 1
          }
          Write-Output "App version matches: $env:VERSION"

      - name: Check the production relay is actually in the binary
        # Same gate as the macOS job. Without a compiled-in BUZZ_RELAY_URL the
        # app falls back to ws://localhost:3000 and every first-run community
        # creation fails, while the installer, version and signature all look
        # correct. See the macOS step for the failure this caught.
        shell: pwsh
        run: |
          $bin = "desktop/src-tauri/target/$env:TARGET/release/buzz-desktop.exe"
          if (-not (Test-Path $bin)) { Write-Error "Missing $bin"; exit 1 }
          # ISO-8859-1 maps every byte to one char, so the compiled-in ASCII
          # string survives the decode and .Contains is a single native scan.
          $latin1 = [System.Text.Encoding]::GetEncoding(28591)
          $text = $latin1.GetString([System.IO.File]::ReadAllBytes($bin))
          if (-not $text.Contains($env:COLONY_PRODUCTION_RELAY_WS_URL)) {
            Write-Error "This build has no compiled-in relay URL, so the app defaults to ws://localhost:3000 and first-run community creation fails for every user. build.rs needs BUZZ_RELAY_URL in the build step's environment."
            exit 1
          }
          Write-Output "Production relay compiled into the shipped binary"

      - name: Locate Windows build artifacts
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          EXE=$(find "$BUNDLE_DIR/nsis" -name '*.exe' -type f | head -1)
          if [[ -z "$EXE" ]]; then
            echo "::error::No NSIS installer found in $BUNDLE_DIR/nsis"
            exit 1
          fi
          SIG="${EXE}.sig"
          if [[ ! -s "$SIG" ]]; then
            echo "::error::${SIG} missing or empty — the build had no signing key"
            exit 1
          fi
          # Rename with an _unsigned marker (no code-signing cert yet),
          # keeping the detached signature in lockstep so latest.json and the
          # uploaded asset always name the same artifact.
          EXE_DIR=$(dirname "$EXE")
          MARKED="$EXE_DIR/Colony_${VERSION}_x86_64-setup_unsigned.exe"
          mv "$EXE" "$MARKED"
          mv "$SIG" "${MARKED}.sig"
          echo "EXE_PATH=$MARKED" >> "$GITHUB_ENV"
          echo "EXE_SIG=${MARKED}.sig" >> "$GITHUB_ENV"

      # The token is minted after the long build so its one-hour lifetime
      # cannot expire before the upload. Same App as the release tagger,
      # scoped down to colony-releases only.
      - name: Create release publisher token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BUZZ_RELEASE_TAGGER_CLIENT_ID }}
          private-key: ${{ secrets.BUZZ_RELEASE_TAGGER_PRIVATE_KEY }}
          owner: AI-Native-Ventures
          repositories: colony-releases
          permission-contents: write

      - name: Publish to colony-releases
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          STAGING=$(mktemp -d)
          # The site's download button fetches the unversioned asset name via
          # /releases/latest/download/Colony_x86_64-setup_unsigned.exe, so
          # every release must carry BOTH names.
          cp "$EXE_PATH" "$STAGING/Colony_x86_64-setup_unsigned.exe"
          if ! gh release view "$TAG" --repo AI-Native-Ventures/colony-releases >/dev/null 2>&1; then
            gh release create "$TAG" --repo AI-Native-Ventures/colony-releases \
              --title "Colony ${VERSION}" \
              --notes "Colony ${VERSION} for Windows (unsigned NSIS installer)."
          fi
          gh release upload "$TAG" --repo AI-Native-Ventures/colony-releases --clobber \
            "$EXE_PATH" "$EXE_SIG" "$STAGING/Colony_x86_64-setup_unsigned.exe"

      # The auto-update loop. The app polls one fixed URL, so the manifest
      # lives on a rolling tag; each platform merges its own entry into
      # latest.json (see desktop/scripts/merge-latest-json.sh), which carries
      # the other platform's entry over only when it was built for the same
      # version. Archive first: a manifest that references an asset nobody
      # has uploaded yet turns every client's update check into a 404.
      - name: Publish the installer and this platform's manifest fragment
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          ROLLING=colony-desktop-latest
          STAGING=$(mktemp -d)
          EXE_NAME=$(basename "$EXE_PATH")
          cp "$EXE_PATH" "$STAGING/$EXE_NAME"
          EXE_URL="https://github.com/AI-Native-Ventures/colony-releases/releases/download/${ROLLING}/${EXE_NAME}"

          # See the Mac job for why this no longer writes latest.json: two
          # jobs merging into one asset is a read-modify-write race, and this
          # job is the one that won it on v0.11.8 and dropped the Mac entry.
          jq -n \
            --arg version "$VERSION" \
            --arg key "windows-x86_64" \
            --arg signature "$(cat "$EXE_SIG")" \
            --arg url "$EXE_URL" \
            '{version: $version, key: $key, signature: $signature, url: $url}' \
            > "$STAGING/fragment-windows-x86_64.json"

          if ! gh release view "$ROLLING" --repo AI-Native-Ventures/colony-releases >/dev/null 2>&1; then
            gh release create "$ROLLING" --repo AI-Native-Ventures/colony-releases \
              --prerelease --title "Colony auto-update manifest" \
              --notes "Rolling target for the desktop auto-updater. Do not download from here; use the versioned release."
          fi
          gh release upload "$ROLLING" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/$EXE_NAME"
          gh release upload "$ROLLING" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/fragment-windows-x86_64.json"

      - name: Verify the public download
        run: |
          set -euo pipefail
          EXPECTED=$(stat -c %s "$EXE_PATH")
          URL="https://github.com/AI-Native-Ventures/colony-releases/releases/latest/download/Colony_x86_64-setup_unsigned.exe"
          for attempt in 1 2 3 4 5; do
            GOT=$(curl -sIL "$URL" | grep -i '^content-length:' | tail -1 | awk '{print $2}' | tr -d '\r')
            if [ "${GOT:-0}" = "$EXPECTED" ]; then
              echo "latest/download serves the new installer ($GOT bytes)"
              exit 0
            fi
            echo "Attempt $attempt: got '${GOT:-none}' bytes, expected $EXPECTED; retrying"
            sleep 10
          done
          echo "::error::latest/download/Colony_x86_64-setup_unsigned.exe does not serve the freshly published installer"
          exit 1

  # The single writer of latest.json.
  #
  # Both platform jobs used to read the manifest, merge their own entry and
  # upload the result. That is a read-modify-write race on one asset with no
  # lock: on v0.11.8 the Windows job read before the Mac job's upload landed
  # and wrote after it, so the published manifest carried only
  # `windows-x86_64` and every Mac client's update check failed with "None of
  # the fallback platforms were found in the response `platforms` object".
  # Each job's own verify passed, because each only checked its own key.
  #
  # Platform jobs now publish a fragment under a filename only they write, and
  # this job composes the manifest from whichever fragments this release
  # produced. One writer, so there is nothing to race.
  publish-manifest:
    name: Publish the update manifest
    needs: [publish-macos, publish-windows]
    # `always()` so a release that builds one platform, or where one platform
    # fails, still publishes a manifest for the platform that succeeded —
    # never publishing is how a good build reaches nobody.
    if: |
      always() && !inputs.preflight_only && github.repository == 'AI-Native-Ventures/Colony' &&
      (needs.publish-macos.result == 'success' || needs.publish-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing manifest for v$VERSION"

      - name: Create release publisher token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BUZZ_RELEASE_TAGGER_CLIENT_ID }}
          private-key: ${{ secrets.BUZZ_RELEASE_TAGGER_PRIVATE_KEY }}
          owner: AI-Native-Ventures
          repositories: colony-releases
          permission-contents: write

      - name: Compose and publish latest.json
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          ROLLING=colony-desktop-latest
          STAGING=$(mktemp -d)
          mkdir -p "$STAGING/frags"

          for KEY in darwin-aarch64 windows-x86_64; do
            NAME="fragment-${KEY}.json"
            # Fragments are read through the API for the same reason the merge
            # was: the download CDN serves a stale copy for minutes after an
            # upload, and a stale fragment would republish the previous
            # release's signature under this release's version.
            #
            # fetch-latest-json.sh prints nothing and exits 0 when the asset is
            # absent, so emptiness is the "not published" signal, not the exit
            # code.
            desktop/scripts/fetch-latest-json.sh \
              AI-Native-Ventures/colony-releases "$ROLLING" "$NAME" \
              > "$STAGING/frags/$NAME" 2>/dev/null || true
            if [ -s "$STAGING/frags/$NAME" ]; then
              GOT=$(jq -r '.version' "$STAGING/frags/$NAME")
              if [ "$GOT" != "$VERSION" ]; then
                echo "Skipping $KEY: fragment is for v$GOT, this release is v$VERSION"
                rm -f "$STAGING/frags/$NAME"
              fi
            else
              echo "No fragment published for $KEY"
              rm -f "$STAGING/frags/$NAME"
            fi
          done

          TRIPLES=()
          for FRAG in "$STAGING/frags"/*.json; do
            [ -e "$FRAG" ] || continue
            KEY=$(jq -r '.key' "$FRAG")
            jq -r '.signature' "$FRAG" > "$STAGING/${KEY}.sig"
            URL=$(jq -r '.url' "$FRAG")
            TRIPLES+=("${KEY}:${STAGING}/${KEY}.sig:${URL}")
          done

          if [ ${#TRIPLES[@]} -eq 0 ]; then
            echo "::error::No fragment for v$VERSION from any platform; refusing to publish an empty manifest"
            exit 1
          fi

          desktop/scripts/fetch-latest-json.sh \
            AI-Native-Ventures/colony-releases "$ROLLING" > "$STAGING/current.json"

          desktop/scripts/merge-latest-json.sh "$VERSION" "@$STAGING/current.json" \
            "$STAGING/latest.json" "${TRIPLES[@]}"

          gh release upload "$ROLLING" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/latest.json"

          echo "PUBLISHED_KEYS=$(jq -r '[.platforms|keys[]]|join(" ")' "$STAGING/latest.json")" >> "$GITHUB_ENV"

      - name: Verify every platform in the published manifest
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          # Read what was stored, not what the CDN is still serving. Each
          # platform job used to verify only its own key, which is why the
          # v0.11.8 manifest passed verification while missing macOS entirely.
          MANIFEST=$(desktop/scripts/fetch-latest-json.sh \
            AI-Native-Ventures/colony-releases colony-desktop-latest)
          GOT_VERSION=$(echo "$MANIFEST" | jq -r '.version')
          if [ "$GOT_VERSION" != "$VERSION" ]; then
            echo "::error::Manifest says version $GOT_VERSION, expected $VERSION"
            exit 1
          fi
          for KEY in $PUBLISHED_KEYS; do
            URL=$(echo "$MANIFEST" | jq -r --arg k "$KEY" '.platforms[$k].url // ""')
            SIG=$(echo "$MANIFEST" | jq -r --arg k "$KEY" '.platforms[$k].signature // ""')
            if [ -z "$URL" ] || [ -z "$SIG" ]; then
              echo "::error::Manifest is missing $KEY after publish"
              exit 1
            fi
            CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL")
            if [ "$CODE" != "200" ]; then
              echo "::error::$KEY points at $URL which returned HTTP $CODE"
              exit 1
            fi
            echo "$KEY: signed, and its archive is reachable"
          done
          echo "Manifest v$VERSION complete for: $PUBLISHED_KEYS"
