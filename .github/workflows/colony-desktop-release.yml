name: Colony desktop release

# Builds and publishes the Colony desktop app to the public
# AI-Native-Ventures/colony-releases repo, whose /releases/latest/download
# URL the marketing site's download button points at. Exists because
# upstream's release.yml is gated to `github.repository == 'block/buzz'` and
# its signing pipeline needs Block's certificates; this fork ships an
# ad-hoc-signed Apple Silicon dmg and an unsigned Windows NSIS installer.
#
# Two independent jobs, one per platform — no `needs` between them, so the
# Mac release publishes the moment its build finishes and the Windows job
# lands whenever its cold build finishes:
#   publish-macos   — tag push (normal release) or dispatch. Runs on a
#                     self-hosted Mac runner (labels: self-hosted, macOS,
#                     colony-builder). Hosted macOS runners would work now
#                     that the repo is public, but a release rebuilds the
#                     whole Rust workspace cold every time; the self-hosted
#                     runner's persistent workspace keeps the cargo cache
#                     warm, which is the difference between a ~20 minute
#                     release and an hour.
#   publish-windows — tag push (every release, in parallel with the Mac) or
#                     dispatch. Hosted windows-latest (~60-90 min cold
#                     build; minutes are free because the repo is public).
#                     The NSIS installer is unsigned, so Windows shows a
#                     SmartScreen warning until a code-signing cert is added.
#
# Auto-update: the app polls latest.json on the rolling colony-desktop-latest
# release, and each job signs its updater artifact, uploads it, and merges
# its platform entry into that manifest (see desktop/scripts/
# merge-latest-json.sh). The endpoint is compiled into each build, so it can
# never change without stranding installs. The manifest has one top-level
# version shared by all platforms, so entries are only carried across
# releases when they were built for the same version.
#
# Normal releases arrive through the push:tags trigger. The tag is created
# by auto-tag-on-release-pr-merge.yml when a merged PR bumps the version in
# desktop/src-tauri/tauri.conf.json. workflow_dispatch is the manual path
# for a platform rescue build or a Windows-only release at an existing
# immutable tag; the run must be dispatched with the v<version> tag as its
# ref (gh workflow run ... --ref v0.10.8 -f version=0.10.8), because
# verify-release-ref.sh rejects any run whose ref, checked-out HEAD, and tag
# do not resolve to one commit, so there is no caller-selected source ref.

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version e.g. 0.7.0 (no v prefix) — must match the v<version> tag this run is dispatched from"
        required: true
      platform:
        description: "Which platform(s) to build and publish"
        type: choice
        options:
          - macos
          - windows
          - both
        default: macos

permissions:
  contents: read

# Never cancel a tag build mid-publish.
concurrency:
  group: colony-desktop-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The manifest the shipped app polls. It lives on a rolling release tag so
  # the URL never changes; every release rewrites latest.json there, each
  # platform merging its own entry. Changing this string strands every
  # already-installed copy, because the endpoint is compiled into the binary
  # at build time.
  UPDATER_ENDPOINT: https://github.com/AI-Native-Ventures/colony-releases/releases/download/colony-desktop-latest/latest.json

jobs:
  publish-macos:
    name: Publish macOS (Apple Silicon)
    if: github.repository == 'AI-Native-Ventures/Colony' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'macos' || inputs.platform == 'both')))
    runs-on: [self-hosted, macOS, colony-builder]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release ref
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          scripts/verify-release-ref.sh v "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Unlike a hosted runner, this one is a real machine whose disk is shared
      # with development worktrees, so it can already be nearly full when a
      # release starts. v0.10.9 spent ~20 minutes compiling and then died with
      #   cp: desktop/src-tauri/binaries/buzz-aarch64-apple-darwin:
      #   fcopyfile failed: No space left on device
      # which reads like a build bug rather than a full disk. Check first and
      # say plainly what filled it.
      #
      # The floor covers a cold build: the workspace holds ~8 GiB warm (~5.5
      # GiB of that in target/ dirs), a cold rebuild transiently needs roughly
      # double, and bundling copies the .app, dmg and tar.gz on top. The usual
      # cause of a full disk here is one cargo target/ per git worktree.
      - name: Check the runner has room to build
        env:
          MIN_FREE_GIB: "25"
        run: |
          set -euo pipefail
          AVAIL_GIB=$(($(df -Pk . | awk 'NR==2 {print $4}') / 1024 / 1024))
          echo "Free space on the release volume: ${AVAIL_GIB} GiB (minimum ${MIN_FREE_GIB} GiB)"
          if [ "$AVAIL_GIB" -ge "$MIN_FREE_GIB" ]; then
            exit 0
          fi
          echo "::error::Only ${AVAIL_GIB} GiB free on the release runner, and a release build needs at least ${MIN_FREE_GIB} GiB. Failing now instead of part way through the build. Free space and re-run this job at the same tag."
          echo "Largest cargo target directories under ${HOME} (usually one per git worktree):"
          find "$HOME" -maxdepth 6 -type d -name target -prune 2>/dev/null \
            | while read -r d; do du -sk "$d" 2>/dev/null; done \
            | sort -rn | head -10 \
            | awk '{printf "  %7.1f GiB  %s\n", $1/1024/1024, $2}'
          exit 1

      - name: Build sidecar binaries
        run: |
          . ./bin/activate-hermit
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --target aarch64-apple-darwin \
            -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          scripts/bundle-sidecars.sh aarch64-apple-darwin

      - name: Check sidecars are real binaries
        # The build recipe `touch`es sidecar paths, which creates 0-byte stubs
        # when the staging step above was skipped or failed silently. A dmg
        # with stub sidecars installs fine and then cannot launch any agent,
        # so refuse to continue with any suspiciously small sidecar.
        run: |
          for bin in buzz-acp buzz-agent buzz-dev-mcp git-credential-nostr buzz; do
            f="desktop/src-tauri/binaries/${bin}-aarch64-apple-darwin"
            size=$(stat -f %z "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 500000 ]; then
              echo "::error::Sidecar $f is ${size} bytes — a stub, not a real binary"
              exit 1
            fi
          done

      # Writes desktop/src-tauri/tauri.release.conf.json: the updater pubkey
      # and endpoint, plus createUpdaterArtifacts so the build emits the
      # .app.tar.gz and its signature. It is a delta merged over
      # tauri.conf.json, so the ad-hoc signingIdentity in the base config
      # still applies. The build also needs the signing key in the
      # environment: without it Tauri emits the archive unsigned and every
      # client rejects the update.
      - name: Write the release config
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
        run: |
          . ./bin/activate-hermit
          cd desktop && node scripts/build-release-config.mjs

      - name: Build desktop app
        env:
          # build.rs reads these two, not just the config generator: it only
          # emits cfg(buzz_updater_enabled) when both are present, and without
          # that cfg lib.rs compiles the updater plugin out of the binary
          # entirely. 0.8.0 and 0.9.0 shipped that way — signed archive,
          # correct manifest, and an app that answers "plugin updater not
          # found" — because this step had the signing key but not these.
          BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          . ./bin/activate-hermit
          export PATH="$HOME/.cargo/bin:$PATH"
          # Presence, never the values: build.rs silently produces an app
          # without an updater when either is missing, and that is invisible
          # in every artifact the build emits.
          echo "updater public key present: ${BUZZ_UPDATER_PUBLIC_KEY:+yes}"
          echo "updater endpoint present:   ${BUZZ_UPDATER_ENDPOINT:+yes}"
          just desktop-release-build aarch64-apple-darwin src-tauri/tauri.release.conf.json

      - name: Verify the bundle
        run: |
          BUNDLE=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          APP="$BUNDLE/macos/Colony.app"
          DMG="$BUNDLE/dmg/Colony_${VERSION}_aarch64.dmg"
          test -d "$APP" || { echo "::error::Missing $APP"; exit 1; }
          test -f "$DMG" || { echo "::error::Missing $DMG"; exit 1; }
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          if [ "$PLIST_VERSION" != "$VERSION" ]; then
            echo "::error::Built app reports version $PLIST_VERSION, expected $VERSION"
            exit 1
          fi
          codesign --verify --deep --strict "$APP"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Check the updater is actually in the binary
        # The one property no downstream artifact reveals. Everything else
        # about a release can be correct while the app cannot update itself.
        run: |
          set -euo pipefail
          BIN=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Colony.app/Contents/MacOS/buzz-desktop
          # `grep -c`, not `grep -q`: -q exits at the first match, which sends
          # SIGPIPE to `strings` mid-stream on a 130MB binary, and under
          # `pipefail` that failure becomes the pipeline's result. The gate
          # then reports "missing" precisely when the marker IS present.
          MARKERS=$(strings -a "$BIN" | grep -c "buzz-updater-enabled" || true)
          echo "updater marker occurrences: ${MARKERS:-0}"
          if [ "${MARKERS:-0}" -eq 0 ]; then
            echo "::error::The updater plugin is not compiled into this build. \
          build.rs needs BUZZ_UPDATER_PUBLIC_KEY and BUZZ_UPDATER_ENDPOINT in \
          the build step's environment; without them the app ships unable to \
          update itself while every other release artifact looks correct."
            exit 1
          fi
          echo "Updater plugin present in the shipped binary"

      - name: Locate the updater archive
        # Tauri writes Colony.app.tar.gz next to the .app and signs it with the
        # updater key. An unsigned or missing archive means the build silently
        # lost TAURI_SIGNING_PRIVATE_KEY, which would publish a manifest no
        # client can verify, so fail here rather than ship it.
        run: |
          set -euo pipefail
          BUNDLE=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          ARCHIVE=$(find "$BUNDLE/macos" -name '*.app.tar.gz' ! -name '*.sig' -type f | head -1)
          if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
            echo "::error::No updater archive in $BUNDLE/macos — is createUpdaterArtifacts on?"
            exit 1
          fi
          if [ ! -s "${ARCHIVE}.sig" ]; then
            echo "::error::${ARCHIVE}.sig missing or empty — the build had no signing key"
            exit 1
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "ARCHIVE_SIG=${ARCHIVE}.sig" >> "$GITHUB_ENV"

      # The token is minted after the long build so its one-hour lifetime
      # cannot expire before the upload. Same App as the release tagger,
      # scoped down to colony-releases only.
      - name: Create release publisher token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BUZZ_RELEASE_TAGGER_CLIENT_ID }}
          private-key: ${{ secrets.BUZZ_RELEASE_TAGGER_PRIVATE_KEY }}
          owner: AI-Native-Ventures
          repositories: colony-releases
          permission-contents: write

      - name: Publish to colony-releases
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          STAGING=$(mktemp -d)
          # The site's download button fetches the unversioned asset name via
          # /releases/latest/download/Colony_aarch64.dmg, so every release
          # must carry BOTH names.
          cp "$DMG" "$STAGING/Colony_${VERSION}_aarch64.dmg"
          cp "$DMG" "$STAGING/Colony_aarch64.dmg"
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          {
            echo "Colony ${VERSION} for macOS (Apple Silicon)."
            echo
            if [ -n "$PREV" ]; then
              echo "Changes since ${PREV}:"
              git log --no-merges --pretty='- %s' "${PREV}..${TAG}"
            else
              echo "Recent changes:"
              git log --no-merges --pretty='- %s' -25 "${TAG}"
            fi
          } > "$STAGING/notes.md"
          if ! gh release view "$TAG" --repo AI-Native-Ventures/colony-releases >/dev/null 2>&1; then
            gh release create "$TAG" --repo AI-Native-Ventures/colony-releases \
              --title "Colony ${VERSION}" --notes-file "$STAGING/notes.md"
          fi
          cp "$ARCHIVE" "$STAGING/Colony_${VERSION}_aarch64.app.tar.gz"
          gh release upload "$TAG" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/Colony_${VERSION}_aarch64.dmg" "$STAGING/Colony_aarch64.dmg" \
            "$STAGING/Colony_${VERSION}_aarch64.app.tar.gz"

      # The auto-update loop. The app polls one fixed URL, so the manifest
      # lives on a rolling tag that every release overwrites, while the
      # archive it points at keeps its version in the filename: a client that
      # cached an older manifest then downloads the archive that manifest was
      # signed for, instead of a newer archive its signature cannot verify.
      - name: Publish the update manifest
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          ROLLING=colony-desktop-latest
          STAGING=$(mktemp -d)
          ARCHIVE_NAME="Colony_${VERSION}_aarch64.app.tar.gz"
          cp "$ARCHIVE" "$STAGING/$ARCHIVE_NAME"
          ARCHIVE_URL="https://github.com/AI-Native-Ventures/colony-releases/releases/download/${ROLLING}/${ARCHIVE_NAME}"

          # Read the current manifest through the API, not the download URL:
          # the CDN serves a stale copy for minutes after an upload, and
          # merging onto a stale copy drops the other platform's entry.
          desktop/scripts/fetch-latest-json.sh \
            AI-Native-Ventures/colony-releases "$ROLLING" > "$STAGING/current.json"

          desktop/scripts/merge-latest-json.sh "$VERSION" "@$STAGING/current.json" "$STAGING/latest.json" \
            "darwin-aarch64:${ARCHIVE_SIG}:${ARCHIVE_URL}"

          if ! gh release view "$ROLLING" --repo AI-Native-Ventures/colony-releases >/dev/null 2>&1; then
            gh release create "$ROLLING" --repo AI-Native-Ventures/colony-releases \
              --prerelease --title "Colony auto-update manifest" \
              --notes "Rolling target for the desktop auto-updater. Do not download from here; use the versioned release."
          fi
          # Archive first: a manifest that references an asset nobody has
          # uploaded yet turns every client's update check into a 404.
          gh release upload "$ROLLING" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/$ARCHIVE_NAME"
          gh release upload "$ROLLING" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/latest.json"

      - name: Verify the update manifest
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          # Read what was actually stored, not what the download CDN is still
          # serving. Reading the CDN here failed v0.10.9 on both platforms
          # while every published artifact was correct.
          MANIFEST=$(desktop/scripts/fetch-latest-json.sh \
            AI-Native-Ventures/colony-releases colony-desktop-latest)
          GOT_VERSION=$(echo "$MANIFEST" | jq -r '.version')
          GOT_URL=$(echo "$MANIFEST" | jq -r '.platforms["darwin-aarch64"].url')
          GOT_SIG=$(echo "$MANIFEST" | jq -r '.platforms["darwin-aarch64"].signature')
          if [ "$GOT_VERSION" != "$VERSION" ]; then
            echo "::error::Manifest says version $GOT_VERSION, expected $VERSION"
            exit 1
          fi
          if [ "$GOT_SIG" != "$(cat "$ARCHIVE_SIG")" ]; then
            echo "::error::Manifest signature does not match the signature this build produced"
            exit 1
          fi
          EXPECTED=$(stat -f %z "$ARCHIVE")
          for attempt in 1 2 3 4 5; do
            SERVED=$(curl -sIL "$GOT_URL" | grep -i '^content-length:' | tail -1 | awk '{print $2}' | tr -d '\r')
            if [ "${SERVED:-0}" = "$EXPECTED" ]; then
              echo "Manifest and archive agree: v${VERSION}, ${SERVED} bytes"
              exit 0
            fi
            echo "Attempt $attempt: archive served ${SERVED:-none} bytes, expected $EXPECTED; retrying"
            sleep 10
          done
          echo "::error::The archive the manifest points at is not the one this build produced"
          exit 1

      - name: Verify the public download
        run: |
          set -euo pipefail
          EXPECTED=$(stat -f %z "$DMG")
          URL="https://github.com/AI-Native-Ventures/colony-releases/releases/latest/download/Colony_aarch64.dmg"
          for attempt in 1 2 3 4 5; do
            GOT=$(curl -sIL "$URL" | grep -i '^content-length:' | tail -1 | awk '{print $2}' | tr -d '\r')
            if [ "${GOT:-0}" = "$EXPECTED" ]; then
              echo "latest/download serves the new dmg ($GOT bytes)"
              exit 0
            fi
            echo "Attempt $attempt: got '${GOT:-none}' bytes, expected $EXPECTED; retrying"
            sleep 10
          done
          echo "::error::latest/download/Colony_aarch64.dmg does not serve the freshly published dmg"
          exit 1

  publish-windows:
    name: Publish Windows (NSIS, unsigned)
    if: github.repository == 'AI-Native-Ventures/Colony' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'windows' || inputs.platform == 'both')))
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release ref
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          scripts/verify-release-ref.sh v "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Hosted Windows has no hermit: MSVC comes from the runner image and
      # rust-toolchain.toml (1.95.0) is honored by the toolchain action.
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          # Disable dependency caching: a writable cache in this release
          # workflow (contents: write, feeds a signed installer) is a
          # poisoning vector. pnpm install runs uncached below.
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      # Same release config the Mac job writes: the updater pubkey and
      # endpoint plus createUpdaterArtifacts, so the NSIS build emits the
      # installer signature the manifest needs.
      - name: Write the release config
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
        run: |
          cd desktop && node scripts/build-release-config.mjs

      - name: Build sidecar binaries
        run: |
          cargo build --release --target "$TARGET" \
            -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          scripts/bundle-sidecars.sh "$TARGET"

      - name: Check sidecars are real binaries
        # Same stub guard as the Mac job: an installer with stub sidecars
        # installs fine and then cannot launch any agent.
        run: |
          for bin in buzz-acp buzz-agent buzz-dev-mcp git-credential-nostr buzz; do
            f="desktop/src-tauri/binaries/${bin}-${TARGET}.exe"
            size=$(stat -c %s "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 500000 ]; then
              echo "::error::Sidecar $f is ${size} bytes — a stub, not a real binary"
              exit 1
            fi
          done

      # No mesh-llm feature: the mesh runtime is macOS-only (Metal) and is
      # not compiled or tested for Windows in CI.
      - name: Build Windows NSIS installer (unsigned)
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cd desktop && pnpm tauri build --verbose --target "$TARGET" --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Verify the built app version
        shell: pwsh
        run: |
          $bin = "desktop/src-tauri/target/$env:TARGET/release/buzz-desktop.exe"
          if (-not (Test-Path $bin)) { Write-Error "Missing $bin"; exit 1 }
          $fileVersion = (Get-Item $bin).VersionInfo.FileVersion
          $normalized = ($fileVersion -split '\.')[0..2] -join '.'
          if ($normalized -ne $env:VERSION) {
            Write-Error "Built app reports version $fileVersion, expected $env:VERSION"
            exit 1
          }
          Write-Output "App version matches: $env:VERSION"

      - name: Locate Windows build artifacts
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          EXE=$(find "$BUNDLE_DIR/nsis" -name '*.exe' -type f | head -1)
          if [[ -z "$EXE" ]]; then
            echo "::error::No NSIS installer found in $BUNDLE_DIR/nsis"
            exit 1
          fi
          SIG="${EXE}.sig"
          if [[ ! -s "$SIG" ]]; then
            echo "::error::${SIG} missing or empty — the build had no signing key"
            exit 1
          fi
          # Rename with an _unsigned marker (no code-signing cert yet),
          # keeping the detached signature in lockstep so latest.json and the
          # uploaded asset always name the same artifact.
          EXE_DIR=$(dirname "$EXE")
          MARKED="$EXE_DIR/Colony_${VERSION}_x86_64-setup_unsigned.exe"
          mv "$EXE" "$MARKED"
          mv "$SIG" "${MARKED}.sig"
          echo "EXE_PATH=$MARKED" >> "$GITHUB_ENV"
          echo "EXE_SIG=${MARKED}.sig" >> "$GITHUB_ENV"

      # The token is minted after the long build so its one-hour lifetime
      # cannot expire before the upload. Same App as the release tagger,
      # scoped down to colony-releases only.
      - name: Create release publisher token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BUZZ_RELEASE_TAGGER_CLIENT_ID }}
          private-key: ${{ secrets.BUZZ_RELEASE_TAGGER_PRIVATE_KEY }}
          owner: AI-Native-Ventures
          repositories: colony-releases
          permission-contents: write

      - name: Publish to colony-releases
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          STAGING=$(mktemp -d)
          # The site's download button fetches the unversioned asset name via
          # /releases/latest/download/Colony_x86_64-setup_unsigned.exe, so
          # every release must carry BOTH names.
          cp "$EXE_PATH" "$STAGING/Colony_x86_64-setup_unsigned.exe"
          if ! gh release view "$TAG" --repo AI-Native-Ventures/colony-releases >/dev/null 2>&1; then
            gh release create "$TAG" --repo AI-Native-Ventures/colony-releases \
              --title "Colony ${VERSION}" \
              --notes "Colony ${VERSION} for Windows (unsigned NSIS installer)."
          fi
          gh release upload "$TAG" --repo AI-Native-Ventures/colony-releases --clobber \
            "$EXE_PATH" "$EXE_SIG" "$STAGING/Colony_x86_64-setup_unsigned.exe"

      # The auto-update loop. The app polls one fixed URL, so the manifest
      # lives on a rolling tag; each platform merges its own entry into
      # latest.json (see desktop/scripts/merge-latest-json.sh), which carries
      # the other platform's entry over only when it was built for the same
      # version. Archive first: a manifest that references an asset nobody
      # has uploaded yet turns every client's update check into a 404.
      - name: Publish the update manifest
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          ROLLING=colony-desktop-latest
          STAGING=$(mktemp -d)
          EXE_NAME=$(basename "$EXE_PATH")
          cp "$EXE_PATH" "$STAGING/$EXE_NAME"
          EXE_URL="https://github.com/AI-Native-Ventures/colony-releases/releases/download/${ROLLING}/${EXE_NAME}"

          # Read the current manifest through the API, not the download URL:
          # the CDN serves a stale copy for minutes after an upload, and
          # merging onto a stale copy drops the other platform's entry. This
          # job finishes long after the Mac one, so a stale read here is
          # exactly how a Mac entry would go missing.
          desktop/scripts/fetch-latest-json.sh \
            AI-Native-Ventures/colony-releases "$ROLLING" > "$STAGING/current.json"

          desktop/scripts/merge-latest-json.sh "$VERSION" "@$STAGING/current.json" "$STAGING/latest.json" \
            "windows-x86_64:${EXE_SIG}:${EXE_URL}"

          if ! gh release view "$ROLLING" --repo AI-Native-Ventures/colony-releases >/dev/null 2>&1; then
            gh release create "$ROLLING" --repo AI-Native-Ventures/colony-releases \
              --prerelease --title "Colony auto-update manifest" \
              --notes "Rolling target for the desktop auto-updater. Do not download from here; use the versioned release."
          fi
          gh release upload "$ROLLING" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/$EXE_NAME"
          gh release upload "$ROLLING" --repo AI-Native-Ventures/colony-releases --clobber \
            "$STAGING/latest.json"

      - name: Verify the update manifest
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          set -euo pipefail
          # Read what was actually stored, not what the download CDN is still
          # serving. Reading the CDN here failed v0.10.9 on both platforms
          # while every published artifact was correct.
          MANIFEST=$(desktop/scripts/fetch-latest-json.sh \
            AI-Native-Ventures/colony-releases colony-desktop-latest)
          GOT_VERSION=$(echo "$MANIFEST" | jq -r '.version')
          GOT_URL=$(echo "$MANIFEST" | jq -r '.platforms["windows-x86_64"].url')
          GOT_SIG=$(echo "$MANIFEST" | jq -r '.platforms["windows-x86_64"].signature')
          if [ "$GOT_VERSION" != "$VERSION" ]; then
            echo "::error::Manifest says version $GOT_VERSION, expected $VERSION"
            exit 1
          fi
          if [ "$GOT_SIG" != "$(cat "$EXE_SIG")" ]; then
            echo "::error::Manifest signature does not match the signature this build produced"
            exit 1
          fi
          # The installer the manifest points at has to be the one this build
          # produced. This is a download-URL check on purpose - it is what a
          # client actually fetches - so it retries through CDN propagation.
          EXPECTED=$(stat -c %s "$EXE_PATH")
          for attempt in 1 2 3 4 5; do
            SERVED=$(curl -sIL "$GOT_URL" | grep -i '^content-length:' | tail -1 | awk '{print $2}' | tr -d '\r')
            if [ "${SERVED:-0}" = "$EXPECTED" ]; then
              echo "Manifest and installer agree: v${VERSION}, ${SERVED} bytes"
              exit 0
            fi
            echo "Attempt $attempt: installer served ${SERVED:-none} bytes, expected $EXPECTED; retrying"
            sleep 10
          done
          echo "::error::The installer the manifest points at is not the one this build produced"
          exit 1

      - name: Verify the public download
        run: |
          set -euo pipefail
          EXPECTED=$(stat -c %s "$EXE_PATH")
          URL="https://github.com/AI-Native-Ventures/colony-releases/releases/latest/download/Colony_x86_64-setup_unsigned.exe"
          for attempt in 1 2 3 4 5; do
            GOT=$(curl -sIL "$URL" | grep -i '^content-length:' | tail -1 | awk '{print $2}' | tr -d '\r')
            if [ "${GOT:-0}" = "$EXPECTED" ]; then
              echo "latest/download serves the new installer ($GOT bytes)"
              exit 0
            fi
            echo "Attempt $attempt: got '${GOT:-none}' bytes, expected $EXPECTED; retrying"
            sleep 10
          done
          echo "::error::latest/download/Colony_x86_64-setup_unsigned.exe does not serve the freshly published installer"
          exit 1
