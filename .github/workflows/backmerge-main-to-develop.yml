name: Back-merge main into develop

# `develop` collects finished work and `main` is the promotion target, so
# anything that lands on `main` without also landing on `develop` becomes
# drift: the next promotion silently reverts it.
#
# That is not hypothetical. Relay release 0.2.1 patched two RUSTSEC advisories
# straight to `main`. Nothing carried them back, so `develop` kept the
# vulnerable versions, and promoting `develop` would have reshipped them with
# nothing in the diff saying so. It was caught by hand, by comparing lockfile
# versions. This workflow is what makes that a control rather than luck.
#
# On every push to `main` it first compares the branch trees. Promotions often
# produce different histories with identical trees; those are synchronized and
# require no write. Genuine drift always goes through a PR to protected
# `develop`: clean merges are queued automatically, while conflicts open a PR
# but fail loudly for human resolution.

on:
  push:
    branches: [main]
  # Lets an operator reconcile the branches without waiting for a push, e.g.
  # after resolving a back-merge PR by hand.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One back-merge at a time. Two overlapping runs would race the same PR.
  group: backmerge-main-to-develop
  cancel-in-progress: false

jobs:
  backmerge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Both branches and their common ancestry are needed to merge.
          fetch-depth: 0
          ref: develop

      - name: Identify the merge author
        run: |
          git config user.name "buzz-backmerge-bot"
          git config user.email "buzz-backmerge-bot@users.noreply.github.com"

      - name: Classify and prepare the back-merge
        id: prepare
        run: |
          set -euo pipefail
          git fetch origin main develop
          status=$(scripts/backmerge-main-to-develop.sh origin/main origin/develop)
          main_sha=$(git rev-parse origin/main)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "branch=backmerge/main-to-develop-${main_sha::12}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse the protected back-merge PR
        id: pull-request
        if: steps.prepare.outputs.status != 'synchronized'
        env:
          GH_TOKEN: ${{ secrets.BACKMERGE_MAINTAINER_TOKEN }}
          STATUS: ${{ steps.prepare.outputs.status }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::BACKMERGE_MAINTAINER_TOKEN is not configured"
            exit 1
          fi

          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base develop \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$pr_number" ]]; then
            echo "reusing open back-merge PR #$pr_number"
          else
            # Never overwrite an unexplained branch. A prior open PR is the
            # only state this workflow is allowed to reuse.
            if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" \
                 >/dev/null 2>&1; then
              echo "::error::Back-merge branch $BRANCH exists without an open PR"
              exit 1
            fi

            git switch -c "$BRANCH"
            git push origin "HEAD:refs/heads/$BRANCH"

            body="$RUNNER_TEMP/backmerge-body.md"
            if [[ "$STATUS" == clean ]]; then
              title="back-merge: main into develop"
              {
                echo '`main` contains clean drift that is missing from `develop`.'
                echo
                echo 'This PR was prepared automatically and will enter the normal'
                echo '`develop` merge queue after its required checks pass.'
              } >"$body"
            else
              title="back-merge: main into develop (conflicts)"
              {
                echo '`main` contains drift that conflicts with `develop`.'
                echo
                echo 'Resolve this PR rather than closing it. Until it merges, the'
                echo 'next promotion of `develop` could silently revert production.'
              } >"$body"
            fi

            pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base develop \
              --head "$BRANCH" \
              --title "$title" \
              --body-file "$body")
            pr_number=${pr_url##*/}
            echo "opened back-merge PR #$pr_number"
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          if [[ "$STATUS" == clean ]]; then
            gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --merge --auto
            echo "armed PR #$pr_number for the protected develop merge queue"
          fi

      - name: Report
        run: |
          case "${{ steps.prepare.outputs.status }}" in
            synchronized) echo "main and develop are synchronized; no write needed" ;;
            clean)        echo "clean drift opened or reused PR #${{ steps.pull-request.outputs.number }} and armed auto-merge" ;;
            conflict)     echo "::error::Conflicting drift opened or reused PR #${{ steps.pull-request.outputs.number }} for human resolution"; exit 1 ;;
            *)            echo "::error::Unknown back-merge status"; exit 1 ;;
          esac
