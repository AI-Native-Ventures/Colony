name: CI
# CI gates every integration point without repeating the same proof. Pull
# requests are path-filtered.  A `develop` push runs only path-selected
# secondary coverage, while a `develop` to `main` promotion reports one
# production Promotion Gate over the exact relevant checks.
on:
  push:
    branches: [main, develop, release]
  pull_request:
    branches: [main, develop, release]

# One run per ref, newest wins. Rapid promotions to main collapse into a
# single run that tests the cumulative state instead of billing one full
# matrix per merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BUZZ_TEST_POSTGRES_PASSWORD: buzz_dev
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    # Every pull request is classified by its actual diff, including a
    # `develop` to `main` promotion.  The Promotion Gate below validates the
    # selected checks; it does not force unrelated desktop/Rust work merely to
    # satisfy a historical branch-protection context.  Release pushes retain
    # broad coverage.
    outputs:
      core-enabled: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/release') && 'true' || 'false' }}
      secondary-enabled: ${{ github.ref != 'refs/heads/main' && 'true' || 'false' }}
      release-push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/release') && 'true' || 'false' }}
      rust: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/release') && 'true' || steps.filter.outputs.rust }}
      desktop: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/release') && 'true' || steps.filter.outputs.desktop }}
      desktop-rust: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/release') && 'true' || steps.filter.outputs.desktop-rust }}
      raw-rust: ${{ steps.filter.outputs.rust }}
      raw-desktop: ${{ steps.filter.outputs.desktop }}
      raw-desktop-rust: ${{ steps.filter.outputs.desktop-rust }}
      raw-web: ${{ steps.filter.outputs.web }}
      raw-mobile: ${{ steps.filter.outputs.mobile }}
      raw-blocks: ${{ steps.filter.outputs.blocks }}
      raw-desktop-integration: ${{ steps.filter.outputs.desktop-integration }}
      raw-windows: ${{ steps.filter.outputs.windows }}
      raw-security: ${{ steps.filter.outputs.security }}
      raw-cross-compile: ${{ steps.filter.outputs.cross-compile }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      blocks: ${{ steps.filter.outputs.blocks }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: github.event_name != 'merge_group'
        with:
          token: ''
          filters: |
            rust:
              - 'crates/**'
              - 'migrations/**'
              - 'schema/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
              - 'scripts/run-tests.sh'
              # Provisioning inputs for the Postgres-backed relay suites. The
              # `Relay Suites` required check skips with this filter, so a
              # change to any of these could break interrupt_gate,
              # interrupt_runtime or e2e_interrupts while the gate stayed
              # green: create-required-extensions.sql is what puts pgcrypto in
              # CI's database, and start-relay-for-tests.sh supplies both the
              # schema and the durable relay key e2e_interrupts requires.
              - 'scripts/start-relay-for-tests.sh'
              - 'scripts/create-required-extensions.sql'
              - 'scripts/attach-schema-partitions.sql'
              - 'justfile'
            # Never put a negated pattern (`!foo/**`) in one of these lists.
            # dorny/paths-filter ORs the patterns in a rule, and picomatch
            # reads `!desktop/src-tauri/**` as "matches every path that is not
            # under desktop/src-tauri" — so a single negation makes the whole
            # rule true for every file in the repo. This list carried
            # `!desktop/src-tauri/**` until 2026-08-17, which meant `desktop`
            # was true on every pull request and the four Desktop Smoke E2E
            # shards ran on README-only diffs. Excluding a subtree needs a
            # separate rule (see `desktop-rust`), not a negation here.
            desktop:
              - 'scripts/check-file-sizes-core.mjs'
              - 'scripts/check-file-sizes-core.test.mjs'
              - 'scripts/native-inventory-core.mjs'
              - 'scripts/native-inventory-core.test.mjs'
              - 'scripts/build-real-shell-app.sh'
              - 'scripts/bundle-sidecars.sh'
              - 'scripts/run-real-shell-e2e.sh'
              - 'desktop/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-pnpm-store-path.sh'
              - 'scripts/ci-prepare-sherpa-onnx.sh'
            desktop-rust:
              - 'desktop/src-tauri/**'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-pnpm-store-path.sh'
              - 'scripts/ci-prepare-sherpa-onnx.sh'
            web:
              - 'scripts/check-file-sizes-core.mjs'
              - 'scripts/check-file-sizes-core.test.mjs'
              - 'web/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-pnpm-store-path.sh'
            mobile:
              - 'scripts/check-file-sizes-core.mjs'
              - 'scripts/check-file-sizes-core.test.mjs'
              - 'mobile/**'
              - 'scripts/mobile-release.sh'
              - 'scripts/mobile-worktree-overrides.sh'
              - 'scripts/mobile-worktree-clean.sh'
              - 'scripts/publish-mobile-release-candidate.sh'
              - 'scripts/release-rulesets.sh'
              - 'scripts/test-mobile-release-contract.sh'
              - 'scripts/test-mobile-release-candidate-publisher.sh'
              - 'scripts/test-mobile-worktree-overrides.sh'
              - '.github/workflows/mobile-release-candidate.yml'
              - '.github/workflows/ci.yml'
            blocks:
              - 'crates/buzz-core/src/block.rs'
              - 'crates/buzz-core/src/kind.rs'
              - 'crates/buzz-relay/src/blocks.rs'
              - 'crates/buzz-relay/src/block_broker.rs'
              - 'crates/buzz-relay/src/core_blocks.rs'
              - 'crates/buzz-relay/src/core_blocks/**'
              - 'desktop/src/features/blocks/**'
              - 'desktop/tests/e2e/blocks-live.spec.ts'
              - 'desktop/tests/e2e/fixtures/fake-acp-agent.mjs'
              - 'desktop/src/shared/constants/kinds.ts'
              - 'migrations/0027_block_action_claims.sql'
              - 'migrations/0028_block_catalog_action_claims.sql'
              - 'scripts/prove-blocks.sh'
              - 'scripts/start-isolated-test-relay.sh'
              - 'docker-compose.harness.yml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-activate-hermit.sh'
              - 'scripts/ci-pnpm-store-path.sh'
              - 'scripts/ci-prepare-sherpa-onnx.sh'
            desktop-integration:
              - 'desktop/**'
              - 'crates/**'
              - 'migrations/**'
              - 'schema/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'pnpm-lock.yaml'
              - 'scripts/start-relay-for-tests.sh'
              - 'scripts/create-required-extensions.sql'
              - 'scripts/attach-schema-partitions.sql'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-activate-hermit.sh'
              - 'scripts/ci-pnpm-store-path.sh'
            windows:
              - 'crates/**'
              - 'desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            security:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'crates/**/Cargo.toml'
              - 'desktop/src-tauri/Cargo.toml'
              - '.github/workflows/ci.yml'
            cross-compile:
              - 'crates/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
      - name: Release workflow source contract
        run: scripts/test-release-ref-contract.sh
      - name: Back-merge workflow contract
        run: scripts/test-backmerge-main-to-develop.sh
      - name: Mobile release contract
        run: |
          scripts/test-mobile-release-contract.sh
          scripts/test-mobile-release-candidate-publisher.sh
      - name: Mobile worktree identity contract
        run: scripts/test-mobile-worktree-overrides.sh
      - name: File size ratchet unit tests
        run: node --test scripts/check-file-sizes-core.test.mjs scripts/native-inventory-core.test.mjs
      - name: Paths filter contract
        # A negated pattern makes its whole paths-filter rule match every file
        # in the repo, so CI silently stops skipping anything. Runs here
        # because this job is required and unconditional -- a path filter
        # cannot skip the guard that checks the path filters.
        run: node --test scripts/paths-filter-contract.test.mjs
      - name: Desktop dev instance identity contract
        # Runs in this job for the same reason the schema drift guard does:
        # `Detect Changed Paths` is required and unconditional, so a path
        # filter cannot skip it. A regression here is silent and expensive --
        # the app keeps launching, just against a different, empty profile.
        run: node --test scripts/instance-env.test.mjs
      - name: Dead token reference guard
        run: |
          # Relay crates are excluded because they still use token auth
          # internally. Client surfaces must not regain the retired API token.
          PATTERNS='TokenScope|MintTokenResponse|hasApiToken|spr_tok_'
          PATHS='desktop/src/ desktop/tests/ mobile/test/ mobile/lib/ .env.example'
          EXCLUDES='--exclude-dir=node_modules --exclude-dir=.dart_tool'
          if grep -rn $EXCLUDES -E "$PATTERNS" $PATHS 2>/dev/null; then
            echo "::error::Dead API token references found in client code. See above."
            exit 1
          fi
          echo "No dead token references found."
      - name: Schema drift check
        # CI provisions Postgres from schema/schema.sql, not from migrations/,
        # so a table added only to migrations/ is invisible here and surfaces
        # later as an unrelated-looking product failure. Runs in this job
        # because `Detect Changed Paths` is required and unconditional, so the
        # guard cannot be skipped by a path filter.
        run: |
          node --test scripts/check-schema-drift.test.mjs
          node scripts/check-schema-drift.mjs

  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.core-enabled == 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.desktop-rust == 'true')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        with:
          cache: "true"
      - name: Format check
        run: just fmt-check
      - name: Desktop Tauri format check
        run: just desktop-tauri-fmt-check
      - name: Clippy
        run: just clippy

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.core-enabled == 'true' && needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        with:
          cache: "true"
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - name: Install cargo-nextest
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cargo-nextest@0.9.136
      - name: Unit tests
        run: just test-unit

  desktop-core:
    name: Desktop Core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.core-enabled == 'true' && (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.rust == 'true')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        with:
          cache: "true"
      # Restore only. A save here ran on every pull request and wrote a 21 MB
      # copy scoped to that pull request's own ref, which no other run can
      # read: the cache store held twenty-odd identical copies of the same
      # hash. Tauri Cache Warm writes the one copy on develop that every
      # branch restores from. A miss still falls back to downloading the
      # archive, so this is a speed path, not a correctness one.
      - name: Restore sherpa-onnx native archive
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Prepare sherpa-onnx native archive
        run: ./scripts/ci-prepare-sherpa-onnx.sh
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri
          # Shared namespace with the Tauri Cache Warm job, which is the only
          # run that can ever write it: this job is gated on core-enabled,
          # which ci.yml sets to false for every push, and a cache written on
          # a refs/pull/N/merge ref is readable only by that one pull request.
          # The effect was measurable -- the live cache store held rust caches
          # for windows-rust, blocks-live-gate and desktop-e2e-relay, every
          # job reachable on a develop push, and none for this one, so the
          # Tauri crate compiled cold on every single pull request.
          shared-key: colony-tauri
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      - name: Install Tauri dependencies (Linux)
        run: |
          scripts/ci-apt-install.sh \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - name: Get pnpm store directory
        id: pnpm-cache
        run: ./scripts/ci-pnpm-store-path.sh
      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install desktop dependencies
        run: just desktop-install-ci
      - name: Desktop lint and format
        run: just desktop-check
      - name: Desktop unit tests
        run: just desktop-test
      - name: Desktop build
        run: just desktop-build
      - name: Desktop Tauri clippy
        run: just desktop-tauri-clippy
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Desktop Tauri check
        run: just desktop-tauri-check
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Desktop Tauri tests
        run: just desktop-tauri-test
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Upload desktop e2e artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-e2e-artifacts
          path: |
            desktop/playwright-report
            desktop/test-results
          if-no-files-found: ignore
      - name: Save pnpm store cache
        if: github.event_name == 'push'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

  desktop-smoke-e2e:
    name: Desktop Smoke E2E (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # 45 not 30: on the self-hosted fleet a cold-cache run can have four
    # heavy jobs sharing the VM's cores, and the 30-minute ceiling killed
    # two shards that were making progress. Warm runs finish far below it.
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.core-enabled == 'true' && (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.rust == 'true')
    strategy:
      fail-fast: false
      matrix:
        # Six, not four. Measured smoke execution across the four shards on
        # run 32102146379 was 12.8 / 10.6 / 11.6 / 14.8 minutes, so the split
        # itself was already even and reordering testMatch buys nothing. The
        # remaining spread is retry cost. Spreading 49.8 minutes of test time
        # over six shards puts every shard near 8 minutes instead of one at 15.
        shard: [1, 2, 3, 4, 5, 6]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        with:
          cache: "true"
      - name: Get pnpm store directory
        id: pnpm-cache
        run: ./scripts/ci-pnpm-store-path.sh
      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install desktop dependencies
        run: just desktop-install-ci
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(cd desktop && node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd desktop && pnpm exec playwright install chromium
      - name: Install Playwright system dependencies
        run: cd desktop && ../scripts/ci-playwright-deps.sh chromium
      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && matrix.shard == 1
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Desktop E2E build
        run: pnpm -C desktop build:e2e
      - name: Desktop smoke e2e
        run: cd desktop && pnpm exec playwright test --project=smoke --shard=${{ matrix.shard }}/6
      - name: Summarize flaky tests
        if: ${{ !cancelled() }}
        run: node scripts/summarize-flaky-tests.mjs playwright-report.json "Desktop Smoke E2E (${{ matrix.shard }})"
        working-directory: desktop
      - name: Upload desktop smoke e2e artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-smoke-e2e-artifacts-${{ matrix.shard }}
          path: |
            desktop/playwright-report
            desktop/playwright-report.json
            desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  desktop-tauri-flags:
    # Split out of Desktop Core, where it was the single most expensive step
    # in all of CI at 10.3 minutes. `just desktop-tauri-test-compiled-flags`
    # flips BUZZ_BUILD_AUTO_CONNECT_DEFAULT_RELAY and
    # BUZZ_BUILD_AGENT_ACCESS_OWNER_ONLY between invocations; both are
    # declared rerun-if-env-changed in desktop/src-tauri/build.rs, so each
    # flip evicts the previous state's artifacts from the shared target dir
    # and the crate rebuilds. Three build states, one target dir, no way to
    # avoid the rebuilds without duplicating every dependency on disk.
    #
    # So run it beside Desktop Core rather than after it. Same shared-key, so
    # both restore the same warm cache, and the roll-up below still requires
    # it. The test itself is unchanged.
    name: Desktop Tauri Flags
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.core-enabled == 'true' && (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.rust == 'true')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        with:
          cache: "true"
      - name: Restore sherpa-onnx native archive
        id: sherpa-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Prepare sherpa-onnx native archive
        run: ./scripts/ci-prepare-sherpa-onnx.sh
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri
          shared-key: colony-tauri
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      - name: Install Tauri dependencies (Linux)
        run: |
          scripts/ci-apt-install.sh \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - name: Get pnpm store directory
        id: pnpm-cache
        run: ./scripts/ci-pnpm-store-path.sh
      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install desktop dependencies
        run: just desktop-install-ci
      # tauri-build validates frontendDist at compile time, so the Tauri crate
      # will not build without desktop/dist on disk.
      - name: Desktop build
        run: just desktop-build
      - name: Desktop Tauri compiled-flag verification
        run: just desktop-tauri-test-compiled-flags
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, desktop-core, desktop-smoke-e2e, desktop-tauri-flags]
    if: always() && needs.changes.outputs.core-enabled == 'true' && (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.rust == 'true')
    permissions:
      contents: read
    steps:
      - name: Check desktop jobs
        run: |
          if [ "${{ needs.desktop-core.result }}" != "success" ]; then
            echo "Desktop Core finished with: ${{ needs.desktop-core.result }}"
            exit 1
          fi
          if [ "${{ needs.desktop-smoke-e2e.result }}" != "success" ]; then
            echo "Desktop Smoke E2E shards finished with: ${{ needs.desktop-smoke-e2e.result }}"
            exit 1
          fi
          if [ "${{ needs.desktop-tauri-flags.result }}" != "success" ]; then
            echo "Desktop Tauri Flags finished with: ${{ needs.desktop-tauri-flags.result }}"
            exit 1
          fi
          echo "Desktop jobs passed"

  desktop-e2e-relay:
    name: Desktop E2E Relay
    runs-on: ubuntu-latest
    # A cold build of the relay artifacts measured 29.3 min, which sat inside
    # the previous 30 min ceiling by seconds. Timing out here is uniquely
    # expensive: the cancelled job never reaches its "Save relay artifacts
    # cache" step, so the next run is cold too and the deadlock repeats. The
    # headroom exists for cold builds only; a cache hit skips every build step.
    timeout-minutes: 45
    needs: [changes]
    if: >
      (needs.changes.outputs.core-enabled == 'true' &&
        (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.rust == 'true')) ||
      (needs.changes.outputs.secondary-enabled == 'true' &&
        (needs.changes.outputs.release-push == 'true' || needs.changes.outputs.raw-desktop-integration == 'true'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        with:
          cache: "true"
      # Reuse the relay binaries and backend test archive when none of their
      # inputs changed (desktop-only PRs hit this every time). The key covers
      # everything they embed, including migrations via sqlx migrate!.
      - name: Restore relay artifacts cache
        id: relay-artifacts-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            target/ci/buzz-relay
            target/ci/git-credential-nostr
            target/ci/backend-integration-tests.tar.zst
          key: relay-artifacts-${{ runner.os }}-${{ hashFiles('crates/**', 'migrations/**', 'Dockerfile', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', '.github/workflows/ci.yml') }}
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        if: steps.relay-artifacts-cache.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.relay-artifacts-cache.outputs.cache-hit != 'true'
        with:
          workspaces: |
            .
            desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install cargo-nextest
        if: steps.relay-artifacts-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cargo-nextest@0.9.136
      - name: Build relay artifacts
        if: steps.relay-artifacts-cache.outputs.cache-hit != 'true'
        run: |
          cargo build --profile ci -p buzz-relay -p git-credential-nostr
          cargo nextest archive \
            --cargo-profile ci \
            -p buzz-db \
            -p buzz-relay \
            -p buzz-test-client \
            --lib \
            --test e2e_event_reminder \
            --test interrupt_gate \
            --test interrupt_runtime \
            --archive-file target/ci/backend-integration-tests.tar.zst
      # develop only. On a pull request this wrote a 131 MB entry scoped to
      # refs/pull/N/merge that no other run could read; eight such copies were
      # live at once, and the eviction pressure they created is what made this
      # job's own cache disappear between runs (0 min on one run, 20 min on
      # the next, same day).
      - name: Save relay artifacts cache
        if: steps.relay-artifacts-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            target/ci/buzz-relay
            target/ci/git-credential-nostr
            target/ci/backend-integration-tests.tar.zst
          key: relay-artifacts-${{ runner.os }}-${{ hashFiles('crates/**', 'migrations/**', 'Dockerfile', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', '.github/workflows/ci.yml') }}
      - name: Upload relay artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-e2e-relay
          path: |
            target/ci/buzz-relay
            target/ci/git-credential-nostr
            target/ci/backend-integration-tests.tar.zst
          if-no-files-found: error
          retention-days: 1

  desktop-e2e-integration-shard:
    name: Desktop E2E Integration (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, desktop-e2e-relay]
    if: >
      needs.changes.outputs.secondary-enabled == 'true' &&
      (needs.changes.outputs.release-push == 'true' || needs.changes.outputs.raw-desktop-integration == 'true')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Activate Hermit
        id: activate-hermit
        continue-on-error: true
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        with:
          cache: "true"
      - name: Retry Hermit activation
        if: steps.activate-hermit.outcome == 'failure'
        run: ./scripts/ci-activate-hermit.sh
      - name: Start integration services
        run: |
          for attempt in 1 2 3; do
            if docker compose up -d postgres redis minio minio-init; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "docker compose up failed after 3 attempts" >&2
              exit 1
            fi
            echo "docker compose up failed (attempt $attempt), retrying in $((attempt * 5))s..." >&2
            sleep $((attempt * 5))
          done
      - name: Get pnpm store directory
        id: pnpm-cache
        run: ./scripts/ci-pnpm-store-path.sh
      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install desktop dependencies
        run: just desktop-install-ci
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(cd desktop && node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd desktop && pnpm exec playwright install chromium
      - name: Install Playwright system dependencies
        run: cd desktop && ../scripts/ci-playwright-deps.sh chromium
      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && matrix.shard == 1
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Desktop E2E build
        run: pnpm -C desktop build:e2e
      - name: Wait for integration services
        run: |
          wait_healthy() {
            local service="$1"
            local container="$2"
            for attempt in $(seq 1 60); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "${container}" 2>/dev/null || echo "not_found")
              if [ "${status}" = "healthy" ]; then
                echo "${service} is healthy"
                return 0
              fi
              sleep 2
            done
            docker logs "${container}" || true
            return 1
          }
          wait_healthy "Postgres" "buzz-postgres"
          wait_healthy "Redis" "buzz-redis"
          wait_healthy "MinIO" "buzz-minio"
      - name: Download relay binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-e2e-relay
          path: target/ci
      - name: Apply schema and seed deployment community
        # MT: the relay resolves each request's tenant from the communities host
        # map and fails closed on an unmapped host. The channel reconciler binds
        # the deployment community ONCE at boot (outside its retry loop) and
        # exits permanently on an unmapped host, so the 'localhost:3000'
        # community MUST exist before the relay starts — the retry loop only
        # handles late-seeded channels, not a late-seeded community. The relay
        # migrates at boot via BUZZ_AUTO_MIGRATE, but that's too late for the
        # pre-boot seed, so apply the schema here first (then drop AUTO_MIGRATE
        # below). lower(host) is the unique index → ON CONFLICT target. psql
        # isn't on PATH in hermit → exec into the buzz-postgres container.
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: buzz
          PGPASSWORD: buzz_dev
          PGDATABASE: buzz
          # Use the already-running docker postgres for desired-state planning instead of
          # downloading an embedded Postgres from Maven Central (transient-fetch flake source).
          PGSCHEMA_PLAN_HOST: localhost
          PGSCHEMA_PLAN_PORT: "5432"
          PGSCHEMA_PLAN_DB: buzz
          PGSCHEMA_PLAN_USER: buzz
          PGSCHEMA_PLAN_PASSWORD: buzz_dev
        run: |
          ./bin/pgschema apply --file schema/schema.sql --auto-approve
          # pgschema does not manage extensions, so schema.sql's CREATE
          # EXTENSION line is silently ignored and the relay's digest()-based
          # queries fail. See scripts/create-required-extensions.sql.
          docker exec -i -e PGPASSWORD=buzz_dev buzz-postgres \
            psql -U buzz -d buzz -v ON_ERROR_STOP=1 < scripts/create-required-extensions.sql
          docker exec -i -e PGPASSWORD=buzz_dev buzz-postgres \
            psql -U buzz -d buzz -v ON_ERROR_STOP=1 < scripts/attach-schema-partitions.sql
          docker exec -e PGPASSWORD=buzz_dev buzz-postgres \
            psql -U buzz -d buzz -qtA -c "
          INSERT INTO communities (id, host)
          VALUES ('00000000-0000-4000-8000-00000000c0de', 'localhost:3000')
          ON CONFLICT (lower(host)) DO NOTHING
          ;"
      - name: Start relay
        run: |
          chmod +x ./target/ci/buzz-relay
          nohup env \
            DATABASE_URL="postgres://buzz:${BUZZ_TEST_POSTGRES_PASSWORD}@localhost:5432/buzz" \
            REDIS_URL=redis://localhost:6379 \
            RELAY_URL=ws://localhost:3000 \
            BUZZ_BIND_ADDR=0.0.0.0:3000 \
            BUZZ_REQUIRE_AUTH_TOKEN=false \
            BUZZ_RECONCILE_CHANNELS=true \
            BUZZ_RATE_LIMIT_HUMAN_MESSAGES_PER_MIN=100000 \
            BUZZ_RATE_LIMIT_HUMAN_API_CALLS_PER_MIN=100000 \
            BUZZ_RATE_LIMIT_HUMAN_WS_EVENTS_PER_SEC=10000 \
            BUZZ_GIT_PROBE_WRITERS=8 \
            SPROUT_REMINDER_SCHEDULER_INTERVAL_SECS=1 \
            ./target/ci/buzz-relay > /tmp/buzz-relay.log 2>&1 &
          echo $! > /tmp/buzz-relay.pid
          for attempt in $(seq 1 60); do
            if ! kill -0 "$(cat /tmp/buzz-relay.pid)" 2>/dev/null; then
              cat /tmp/buzz-relay.log
              exit 1
            fi
            status_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/_readiness || true)
            if [ "${status_code}" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/buzz-relay.log
          exit 1
      - name: Seed desktop e2e data
        run: bash scripts/setup-desktop-test-data.sh
      - name: Desktop relay-backed e2e
        run: cd desktop && pnpm exec playwright test --project=integration --shard=${{ matrix.shard }}/2
      - name: Summarize flaky tests
        if: ${{ !cancelled() }}
        run: node scripts/summarize-flaky-tests.mjs playwright-report.json "Desktop E2E Integration (${{ matrix.shard }}/2)"
        working-directory: desktop
      - name: Upload desktop integration artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-e2e-integration-artifacts-${{ matrix.shard }}
          path: |
            desktop/playwright-report
            desktop/playwright-report.json
            desktop/test-results
            /tmp/buzz-relay.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save pnpm store cache
        if: github.event_name == 'push'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

  desktop-e2e-integration:
    name: Desktop E2E Integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, desktop-e2e-integration-shard]
    if: >
      always() && needs.changes.outputs.secondary-enabled == 'true' &&
      (needs.changes.outputs.release-push == 'true' || needs.changes.outputs.raw-desktop-integration == 'true')
    permissions:
      contents: read
    steps:
      - name: Check integration shards
        run: |
          if [ "${{ needs.desktop-e2e-integration-shard.result }}" != "success" ]; then
            echo "Desktop E2E Integration shards finished with: ${{ needs.desktop-e2e-integration-shard.result }}"
            exit 1
          fi
          echo "Desktop E2E Integration shards passed"

  blocks-live-gate:
    # Runs the Blocks Gate C live loop (protocol kinds 30178/40010-40012)
    # against a real relay/CLI/ACP tuple exactly as scripts/prove-blocks.sh
    # proves it locally: isolated Postgres/Redis/MinIO under the buzz-harness
    # compose project, deterministic ACP fixture, real desktop E2E bundle, and
    # the blocks-live Playwright spec. Reusing the script keeps CI and the
    # local gate proving the same thing; tmux is installed below so the
    # script's process supervision runs unchanged.
    #
    # Runner/cost: GitHub-hosted ubuntu-latest is free on this public repo
    # (standard runners are free and unlimited for public repositories), so
    # this job adds no billing. The self-hosted colony-mac-builder runner is
    # the dev machine itself, where the isolated harness ports (3030/5471/6471)
    # are owned by other work; it must not host this gate. If the repo is ever
    # made private, re-evaluate: a cold run is ~30-50 min, which would bill
    # roughly $2.40-4.00 at $0.08/min on ubuntu-latest.
    name: Blocks Live Gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [changes]
    if: >
      needs.changes.outputs.secondary-enabled == 'true' &&
      (needs.changes.outputs.release-push == 'true' || needs.changes.outputs.raw-blocks == 'true')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
      - name: Activate Hermit
        id: activate-hermit
        continue-on-error: true
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        with:
          cache: "true"
      - name: Retry Hermit activation
        if: steps.activate-hermit.outcome == 'failure'
        run: ./scripts/ci-activate-hermit.sh
      # Restore only. A save here ran on every pull request and wrote a 21 MB
      # copy scoped to that pull request's own ref, which no other run can
      # read: the cache store held twenty-odd identical copies of the same
      # hash. Tauri Cache Warm writes the one copy on develop that every
      # branch restores from. A miss still falls back to downloading the
      # archive, so this is a speed path, not a correctness one.
      - name: Restore sherpa-onnx native archive
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Prepare sherpa-onnx native archive
        run: ./scripts/ci-prepare-sherpa-onnx.sh
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install Tauri and tmux dependencies (Linux)
        run: |
          scripts/ci-apt-install.sh \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            tmux \
            wget
      - name: Get pnpm store directory
        id: pnpm-cache
        run: ./scripts/ci-pnpm-store-path.sh
      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install desktop dependencies
        run: just desktop-install-ci
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(cd desktop && node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd desktop && pnpm exec playwright install chromium
      - name: Install Playwright system dependencies
        run: cd desktop && ../scripts/ci-playwright-deps.sh chromium
      - name: Create Tauri sidecar placeholders
        # prove-blocks.sh runs `cargo test --manifest-path
        # desktop/src-tauri/Cargo.toml agent_proposal`, and Tauri's build.rs
        # validates externalBin at compile time. The just recipe that every
        # other Tauri CI step depends on creates empty placeholders for the
        # host triple; nothing executes them, so stubs are sufficient.
        run: just _ensure-sidecar-stubs
      - name: Run the Blocks live gate
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: ./scripts/prove-blocks.sh
      - name: Upload Blocks gate evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blocks-live-gate-artifacts
          path: |
            desktop/test-results/blocks
            desktop/playwright-report
            /tmp/blocks-relay-run.log
            /tmp/blocks-acp-run.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save pnpm store cache
        if: github.event_name == 'push'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

