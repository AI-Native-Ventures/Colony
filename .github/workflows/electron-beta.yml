name: Electron macOS beta

# Explicit beta builds only. No release, updater or production promotion.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and prove the Electron beta
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          shared-key: electron-beta-release
      - name: Install dependencies
        run: just desktop-install-ci
      - name: Build self-contained app and zip
        run: pnpm --dir desktop electron:package
      - name: Prove relocated app, signup and persistent browser session
        run: |
          set -euo pipefail
          COLONY_SMOKE_APP=$(node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            const root = "desktop/electron-dist";
            const entries = readdirSync(root);
            if (entries.length !== 1) throw new Error("Expected exactly one beta package");
            console.log(JSON.parse(readFileSync(`${root}/${entries[0]}/manifest.json`, "utf8")).app);
          ')
          export COLONY_SMOKE_APP
          node desktop/src-electron/smoke.mjs
          node desktop/src-electron/signup-smoke.mjs
          COLONY_ISOLATION_AGENT="$COLONY_SMOKE_APP/Contents/Resources/native/buzz-agent" \
          COLONY_ISOLATION_MCP="$COLONY_SMOKE_APP/Contents/Resources/native/buzz-dev-mcp" \
          COLONY_ISOLATION_ELECTRON="$COLONY_SMOKE_APP/Contents/MacOS/Colony Electron Beta" \
          cargo test --release --manifest-path desktop/src-tauri/Cargo.toml \
            --features electron-host --lib managed_agents::isolation -- \
            --include-ignored --skip isolated_http_client_verifies_public_tls_through_gateway
      - name: Upload proven beta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: colony-electron-macos-beta
          path: |
            desktop/electron-dist/**/*.zip
            desktop/electron-dist/**/manifest.json
          if-no-files-found: error
          retention-days: 7
