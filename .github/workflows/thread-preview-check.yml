name: Thread preview checks
on:
  push:
    branches: [codex/thread-preview-reset]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616
        with:
          cache: "true"
      - run: just desktop-install-ci
      - name: Format only preview changes
        working-directory: desktop
        run: pnpm exec biome check --write src/features/blocks/websiteDesign.ts src/features/blocks/ui/BlockRenderContext.tsx src/features/blocks/ui/WebsiteBundlePreview.tsx src/features/blocks/ui/ArtifactHtmlPreview.tsx src/features/blocks/ui/artifactPreviewDocument.ts src/features/blocks/ui/artifactPreviewDocument.test.mjs src/features/blocks/ui/BlockRenderer.tsx src/features/blocks/blockRepository.ts tests/e2e/thread-html-preview.spec.ts tests/e2e/thread-website-native.spec.ts tests/e2e/blocks-live.spec.ts
      - name: Format website decision validation
        run: rustfmt --edition 2021 crates/buzz-relay/src/blocks.rs crates/buzz-cli/src/commands/blocks.rs
      - name: Capture formatting patch
        if: always()
        run: git diff > /tmp/thread-preview-format.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: thread-preview-format
          path: /tmp/thread-preview-format.patch
      - name: Preview safety and existing Block contracts
        working-directory: desktop
        run: node --import ./test-loader.mjs --experimental-strip-types --experimental-test-module-mocks --test src/features/blocks/websiteDesign.test.mjs src/features/blocks/ui/artifactPreviewDocument.test.mjs src/features/blocks/blockContracts.test.mjs src/features/blocks/ui/primitives/primitives.test.mjs
      - name: Website bundle validation
        run: node --test desktop/src-electron/website-preview/*.test.mjs
      - name: Typecheck
        working-directory: desktop
        run: pnpm exec tsc --noEmit
      - name: Install browser for bounded rendering check
        working-directory: desktop
        run: pnpm exec playwright install --with-deps chromium
      - name: Render assets in real isolated Electron host
        timeout-minutes: 2
        working-directory: desktop
        run: xvfb-run -a pnpm exec electron --no-sandbox src-electron/website-preview/electron-proof.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-website-preview
          path: desktop/test-results/native-website-preview
      - name: Render preview in existing channel UI
        env:
          COLONY_NATIVE_PREVIEW_PROOF: "1"
        working-directory: desktop
        run: pnpm build:e2e && xvfb-run -a pnpm exec playwright test thread-html-preview.spec.ts thread-website-native.spec.ts --project=smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: thread-preview-rendering
          path: desktop/test-results
      - name: Require committed formatting
        if: always()
        run: git diff --exit-code
