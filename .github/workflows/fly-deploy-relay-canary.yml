name: Deploy canary relay to Fly

# GUARDRAIL: this workflow is the ONLY thing that deploys the canary relay
# (Fly app `colony-relay-canary`), and it deploys ONLY from `develop`. No other
# workflow, and no human running flyctl by hand, should touch that app: the
# canary exists to prove what is on develop, so anything deployed to it from
# another ref makes the canary lie about what it is testing. The workflow_run
# trigger is branch-filtered to develop and the job re-asserts the branch, so a
# tag build or a feature-branch image build can never land here.
#
# It mirrors `.github/workflows/fly-deploy-relay.yml` (the production deploy):
# the same GHCR-to-Fly-registry retag dance exists because Fly Machines cannot
# pull private images from external registries, and local tokens lack
# read:packages, whereas the Actions GITHUB_TOKEN can always read this repo's
# own packages.
#
# Trigger: completion of the "Docker image" workflow on develop. That run
# publishes `:develop` and `:sha-<7>`; this workflow deploys the immutable
# `:sha-<7>` of the exact commit that produced the image, never the moving
# `:develop` tag, so every canary deploy names one traceable commit.
#
# workflow_dispatch is the rescue lane: run it from the ref you want to deploy
# and it defaults to that ref's `sha-<7>` tag, or pass image_tag to pin an
# explicit already-published tag.
#
# Note: GitHub always runs the DEFAULT-BRANCH copy of a workflow_run workflow.
# Edits to this file only take effect once they reach the default branch.

on:
  workflow_run:
    workflows: ["Docker image"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Published colony-relay image tag to deploy (default: sha-<7> of the dispatched ref)"
        required: false
        default: ""

permissions: {}

# One canary deploy at a time. cancel-in-progress is false on purpose: two
# develop merges landing minutes apart must queue, never race, and a cancelled
# run could leave the app half-deployed with no verification behind it.
concurrency:
  group: fly-deploy-relay-canary
  cancel-in-progress: false

env:
  # Mirrors docker.yml's GHCR_IMAGE override so the image this deploys is the
  # image that workflow published; falls back to this fork's namespace.
  IMAGE_NAME: ${{ vars.GHCR_IMAGE != '' && vars.GHCR_IMAGE || 'ghcr.io/ai-native-ventures/colony-relay' }}
  FLY_APP: colony-relay-canary
  CANARY_BASE_URL: https://relay-canary.colony.ainative.ventures

jobs:
  deploy:
    # Success only, develop only. The `branches:` filter above already scopes
    # workflow_run to develop; this repeats it so a filter regression cannot
    # silently widen what reaches the canary.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5.0.0
        with:
          # The commit whose image we are deploying, so the fly config and the
          # verification below match the code that is going live.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Resolve image tag and expected relay version
        id: target
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! $HEAD_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve a commit sha to deploy: '$HEAD_SHA'" >&2
            exit 1
          fi
          # docker/metadata-action's `type=sha,prefix=sha-,format=short`
          # publishes the 7-character short sha; match it exactly.
          TAG="${INPUT_TAG:-sha-${HEAD_SHA:0:7}}"
          # The relay reports its Cargo.toml version over NIP-11; read it from
          # the commit being deployed so the live check has something to match.
          VERSION=$(awk -F'"' '/^version = /{print $2; exit}' crates/buzz-relay/Cargo.toml)
          if [[ -z ${VERSION:-} ]]; then
            echo "could not read buzz-relay version from crates/buzz-relay/Cargo.toml" >&2
            exit 1
          fi
          echo "Deploying $IMAGE_NAME:$TAG (commit $HEAD_SHA, relay version $VERSION) to $FLY_APP"
          {
            echo "tag=$TAG"
            echo "sha=$HEAD_SHA"
            echo "version=$VERSION"
          } >>"$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@63da3ecc5e2793b98a3f2519b3d75d4f4c11cec2 # v1.5

      - name: Relay image into Fly registry and deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          SRC="${IMAGE_NAME}:${TAG}"
          DST="registry.fly.io/${FLY_APP}:${TAG}"
          docker pull --platform linux/amd64 "$SRC"
          docker tag "$SRC" "$DST"
          flyctl auth docker
          docker push "$DST"
          flyctl deploy --config deploy/fly/fly.canary.toml --app "$FLY_APP" \
            --image "$DST" --strategy immediate --yes

      - name: Verify deployed canary image identity
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          # flyctl deploy returns before the machine's image swap fully
          # propagates: four consecutive runs (2026-08-27) each read the
          # PREVIOUS sha here, then the machine ran the expected tag minutes
          # later. So poll for the swap instead of asserting once; 30 x 20s is
          # a hard ceiling - past it something is genuinely stuck and failing
          # loudly is correct.
          found=""
          for attempt in $(seq 1 30); do
            flyctl image show --app "$FLY_APP" --json >/tmp/canary-image.json
            if jq -e --arg tag "$TAG" '[.. | strings] | index($tag) != null' \
              /tmp/canary-image.json >/dev/null; then
              found=1
              break
            fi
            echo "attempt ${attempt}/30: machine not yet on '$TAG'; retrying in 20s." >&2
            sleep 20
          done
          cat /tmp/canary-image.json
          if [[ -z "$found" ]]; then
            echo "$FLY_APP never converged onto image tag '$TAG'" >&2
            exit 1
          fi
          # Field names differ across flyctl versions, so match on values
          # rather than a specific key path.
          if ! jq -e --arg app "$FLY_APP" '[.. | strings] | any(contains($app))' \
            /tmp/canary-image.json >/dev/null; then
            echo "$FLY_APP is not running an image from its own Fly registry repo" >&2
            exit 1
          fi
          echo "$FLY_APP is running $TAG."

      - name: Verify live canary readiness and version
        env:
          # scripts/verify-relay-live.sh takes only the expected version; the
          # host it probes comes from RELAY_LIVE_BASE_URL (default is the
          # production relay), so the canary host is pointed at here.
          RELAY_LIVE_BASE_URL: ${{ env.CANARY_BASE_URL }}
          VERSION: ${{ steps.target.outputs.version }}
        run: scripts/verify-relay-live.sh "$VERSION"
