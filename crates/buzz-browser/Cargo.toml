[package]
name = "buzz-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "buzz_browser"
path = "src/lib.rs"

[[bin]]
name = "buzz-browserd"
path = "src/main.rs"

[features]
# Keep the ACP library's HTTP and WebSocket mode consistent in explicit fixture builds.
onboarding-fixture = ["buzz-acp/onboarding-fixture"]

[dependencies]
buzz-acp = { path = "../buzz-acp" }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Safe wrapper around kill(2), for asking Chromium to shut down cleanly so it
# flushes a persistent profile. Unix-only; terminate_child hard-kills instead
# on other platforms.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile = "3"
