<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gmail Compose Fixture</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f8fc; color: #202124; margin: 0; padding: 20px; }
  .compose-box { max-width: 640px; margin: 20px auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); padding: 16px 20px; }
  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #5f6368; margin-bottom: 4px; }
  .field { width: 100%; padding: 8px 10px; border: 1px solid #dadce0; border-radius: 4px; font-size: 14px; margin-bottom: 12px; box-sizing: border-box; }
  [contenteditable="true"] { min-height: 120px; line-height: 1.5; }
  .btn { display: inline-block; padding: 8px 18px; background: #0b57d0; color: #fff; border: 0; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn:hover { background: #1a73e8; }
  .toast { display: none; margin-top: 12px; padding: 10px 14px; background: #e6f4ea; color: #137333; border-radius: 4px; font-size: 14px; }
  .toast a { color: #137333; text-decoration: underline; margin-left: 8px; }
  pre { background: #f1f3f4; padding: 10px; border-radius: 4px; font-size: 12px; overflow-x: auto; }
</style>
</head>
<body>
  <div class="compose-box">
    <h2>Compose message</h2>
    <label for="to">To recipients</label>
    <input id="to" class="field" type="text" aria-label="To recipients" placeholder="Recipients">

    <label for="subject">Subject</label>
    <input id="subject" class="field" type="text" aria-label="Subject" placeholder="Subject">

    <label for="body">Message Body</label>
    <div id="body" class="field" contenteditable="true" aria-label="Message Body" role="textbox"></div>

    <button id="send" class="btn" aria-label="Send \u200e(\u2318Enter)">Send</button>

    <div id="toast" class="toast">
      Message sent <a href="#" onclick="event.preventDefault(); document.getElementById('toast').style.display='none';">Undo</a>
    </div>

    <pre id="sent"></pre>
  </div>

  <script>
    document.getElementById('send').addEventListener('click', function () {
      var to = document.getElementById('to').value;
      var subject = document.getElementById('subject').value;
      var body = document.getElementById('body').textContent || document.getElementById('body').innerText;
      document.getElementById('sent').textContent = JSON.stringify({
        to: to,
        subject: subject,
        body: body
      }, null, 2);
      document.getElementById('toast').style.display = 'block';
    });
  </script>
</body>
</html>
