  <text x="330" y="148" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b9aee0">Drag to Applications to install.</text>

  <!-- drag cue between the two icon positions, y matches the icon row (330) -->
