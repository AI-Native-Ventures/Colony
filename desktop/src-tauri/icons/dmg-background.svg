<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 532">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1f47"/>
      <stop offset="55%" stop-color="#1c1530"/>
      <stop offset="100%" stop-color="#120d21"/>
