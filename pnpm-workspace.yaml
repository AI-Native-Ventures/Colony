packages:
  - "desktop"
  - "web"
  - "admin-web"
  - "site"
  - "video"
allowBuilds:
  # @wdio/cli pulls edgedriver/geckodriver as optional deps. Their postinstall
  # scripts download browser drivers this suite never uses; deny explicitly so
  # pnpm does not error on ignored builds (and CI stays deterministic).
  edgedriver: false
  esbuild: true
  geckodriver: false
minimumReleaseAgeExclude:
  - '@remotion/bundler@4.0.523'
  - '@remotion/canvas@4.0.523'
  - '@remotion/captions@4.0.523'
  - '@remotion/cli@4.0.523'
  - '@remotion/compositor-darwin-arm64@4.0.523'
  - '@remotion/compositor-darwin-x64@4.0.523'
  - '@remotion/compositor-linux-arm64-gnu@4.0.523'
  - '@remotion/compositor-linux-arm64-musl@4.0.523'
  - '@remotion/compositor-linux-x64-gnu@4.0.523'
  - '@remotion/compositor-linux-x64-musl@4.0.523'
  - '@remotion/compositor-win32-x64-msvc@4.0.523'
  - '@remotion/licensing@4.0.523'
  - '@remotion/media-parser@4.0.523'
  - '@remotion/media-utils@4.0.523'
  - '@remotion/media@4.0.523'
  - '@remotion/player@4.0.523'
  - '@remotion/renderer@4.0.523'
  - '@remotion/streaming@4.0.523'
  - '@remotion/studio-codemods@4.0.523'
  - '@remotion/studio-protocol@4.0.523'
  - '@remotion/studio-server@4.0.523'
  - '@remotion/studio-shared@4.0.523'
  - '@remotion/studio@4.0.523'
  - '@remotion/timeline-utils@4.0.523'
  - '@remotion/web-renderer@4.0.523'
  - '@remotion/zod-types@4.0.523'
  - remotion@4.0.523
  - zod@4.6.0
overrides:
  # Force a single copy of the dismissable-layer. Radix packages otherwise
  # resolve different versions (react-menu pulled 1.1.11, react-dialog 1.1.15),
  # and each copy keeps its own module-level saved <body> pointer-events style —
  # so a modal menu opening a modal dialog left `pointer-events: none` stuck on
  # <body> when the dialog closed, freezing the app (#1482, reminder dialog).
  # Removable once every @radix-ui dep converges on one version naturally.
  "@radix-ui/react-dismissable-layer": 1.1.19
  # linkify-it 5.0.0 (pulled in via markdown-it / tiptap-markdown) is affected
  # by GHSA-22p9-wv53-3rq4 and GHSA-v245-v573-v5vm: crafted link/mailto-heavy
  # text drives quadratic parsing and can freeze the renderer thread. Fixed in
  # 5.0.1 / 5.0.2 respectively; pin >=5.0.2 to cover both. Removable once
  # markdown-it resolves linkify-it >=5.0.2 on its own.
  linkify-it: "^5.0.2"
patchedDependencies:
  isomorphic-git: patches/isomorphic-git.patch
  virtua@0.49.3: patches/virtua@0.49.3.patch
