# C3 — one gpt-5.6-sol lead and two gpt-5.6-luna implementers. The hybrid the
# rest of the world actually builds, and the steelman this study argues against.
#
# "Smart model plans, cheap models type" is the default multi-agent design, and a
# post claiming three cheap agents are enough is much weaker if it never runs the
# obvious alternative. This condition is here to be beaten — or to win, in which
# case the honest finding is that the expensive model earns its seat and the
# headline changes.
#
# Against tb-team-3luna-openai it isolates the *lead's* model: same topology, same
# personas, same worker model, same budget, one endpoint moved. That makes it the
# only clean measurement of what an expensive orchestrator is worth. Against
# tb-solo-sol-openai it asks whether sol is better off delegating or working
# alone.
#
# Cost is the reason to expect this to lose. In a hierarchy the lead accumulates
# the most context — it reads every report from every worker and re-sends the
# accumulated thread on each round — and A1 measured an input:output ratio of
# 49:1, so input tokens are roughly 89% of spend. This condition therefore puts
# the 5x-priced model in the single most token-expensive seat in the roster. The
# per-agent cost split is the chart this condition exists to produce; the
# accounting path already reports cost per agent, so the lead's share can be read
# directly rather than inferred.
#
# It is also the same shape as tb-team-sol-luna.yaml, which runs the identical
# roster through the Databricks gateway. Compare scores across the two; do not
# pool their dollar figures — different serving stack, different route, and until
# both price sheets are confirmed, a different price sheet.
schema_version: "1"
condition: tb-team-sol-2luna-openai
roster:
  - id: orch
    kind: orchestrator
    # Read verbatim by worker.md ("the teammate whose Role column reads `lead`").
    # Identical to tb-team-3luna-openai so the two conditions differ in exactly
    # one field.
    role: lead
    count: 1
    endpoint: gpt-5.6-sol
    model_revision: gpt-5.6-sol
    prompt:
      path: personas/bench/lead-delegate.md
      sha256: 82df9751aeb5235f7122adc06bafdde12084181b0be84b91721e0d1b5e4a14f7

  - id: worker
    kind: worker
    role: implementer
    count: 2
    endpoint: gpt-5.6-luna
    model_revision: gpt-5.6-luna
    prompt:
      path: personas/bench/worker.md
      sha256: 7b3332e3d3da384a7c242c1aa34e90a063e7152ddf6de69f8a4e7e4a0b710726

prices:
  # PLACEHOLDER for both endpoints — the Databricks list prices for the same two
  # models, reused so the accounting path is exercised end to end. NOT checked
  # against OpenAI's published rates.
  #
  # This condition is the one most exposed to getting them wrong, because its
  # cost is a weighted mix of two price sheets rather than a single one: an error
  # in the sol/luna ratio moves C3's total without moving C1's or C2's, so it
  # would distort exactly the comparison this condition exists to make. Replace
  # both before reporting any dollar figure from it.
  gpt-5.6-sol:
    input_per_million_usd: 5.0
    cached_input_per_million_usd: 0.5
    output_per_million_usd: 30.0
    # Fallback only; superseded by the provider's measured cache split, with
    # `accounting_cache_read_tokens_are_measured` recording which was used. 0.0
    # keeps a fallback conservative. The lead is the agent with the longest
    # re-sent prefix and therefore the most to gain from real caching, so a
    # modelled number here would be the least trustworthy figure in the study.
    cache_read_rate: 0.0
  gpt-5.6-luna:
    input_per_million_usd: 1.0
    cached_input_per_million_usd: 0.1
    output_per_million_usd: 6.0
    cache_read_rate: 0.0
trial_budget:
  # Identical to every other condition in the comparison set. See
  # tb-triad-3luna-openai.yaml.
  timeout_seconds: 36000
