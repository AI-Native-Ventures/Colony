# A3 solo baseline: the same single-agent condition as tb-solo-luna and
# tb-solo-sol, on claude-opus-5 — the study's headline frontier denominator.
#
# The question "can three cheap agents match one expensive agent" needs an
# "expensive agent" to name, and this is it. tb-solo-sol stays as a second,
# cheaper-frontier baseline, but Opus 5 is the model the headline is measured
# against. Roster shape, persona bytes, budget and clock are identical to the
# other two solos — only the endpoint moves — so any score or cost difference is
# attributable to the model.
#
# Provider routing note (this is the one thing that differs mechanically from the
# gpt-5.6 solos). Opus 5 does NOT speak the OpenAI `/responses` API that
# gpt-5.6-luna/sol use; the Databricks gateway serves it only on
# `mlflow/v1/chat/completions`, `anthropic/v1/messages` and
# `cursor/v1/chat/completions`. buzz-agent's `databricks_v2` provider already
# handles this: `databricks_v2_route_for_model` sends any model whose name
# contains `claude` to `/ai-gateway/anthropic/v1/messages` with an
# `anthropic_body` and `parse_anthropic`, so no code or manifest-schema change is
# needed — the endpoint name below is all that selects the route. Verified 200 on
# the staging box via the privatelink IP with a well-formed anthropic `usage`
# block (input / cache_read / cache_creation / output). This obsoletes the old
# "Opus needs a Bedrock endpoint" deferral in 02-benchmark-plan.md.
#
# Endpoint names are exact Databricks serving-endpoint names: the runtime passes
# the manifest endpoint name to the gateway as the model. They resolve to
# provider/host/key via testbed/endpoints/databricks-live.json, which is
# deployment config and deliberately outside this manifest.
schema_version: "1"
condition: tb-solo-opus
roster:
  - id: solo
    kind: orchestrator
    role: solo
    count: 1
    endpoint: databricks-claude-opus-5
    model_revision: claude-opus-5
    prompt:
      # Byte-identical to tb-solo-luna and tb-solo-sol. The persona is
      # model- and provider-agnostic on purpose; a prompt tuned per model would
      # make the baselines incomparable.
      path: personas/bench/solo.md
      sha256: 6997ae38384ea4f84bbdc1422a668be089fbfd2709d412392dbbb4911c565596
prices:
  # Reference list prices, doc 02 §2.1 (`anthropic/claude-opus-5`). Note the
  # ratio to luna is NOT a clean 5x on every axis the way sol is: input and
  # cache-read are 5x luna (5.0 vs 1.0, 0.5 vs 0.1) but OUTPUT is ~4.17x
  # (25.0 vs 6.0). The headline break-even math in 02 §2 must use these, not
  # sol's, when Opus is the denominator. See tb-solo-luna.yaml for why
  # cache_read_rate is 0.0 (DB10).
  #
  # Cache-write caveat, and it bites harder here than anywhere else in the study:
  # the anthropic route reports `cache_creation_input_tokens` separately, and
  # Anthropic bills cache writes at ~1.25x the input rate. Our accounting
  # currently prices write tokens at the plain input rate (02 §7.5 residual), so
  # Opus cost is understated by whatever the write volume is. Confirm before any
  # published Opus dollar figure.
  databricks-claude-opus-5:
    input_per_million_usd: 5.0
    cached_input_per_million_usd: 0.5
    output_per_million_usd: 25.0
    # Fallback only; the agent reports the provider's measured cache split
    # (anthropic `cache_read_input_tokens`) and the accounting path prices that,
    # recording which it used (`accounting_cache_read_tokens_are_measured`). 0.0
    # keeps an unmeasured run conservative rather than inventing a discount.
    cache_read_rate: 0.0
trial_budget:
  # Identical to tb-solo-luna and tb-solo-sol — the trial budget is a backstop
  # above the dataset's longest task (12000s) at the 3x multiplier, so each
  # task's own `[agent] timeout_sec` governs instead of a flat harness deadline.
  # A different value here would mean the baselines ran on different clocks, and
  # benchmark.py's check_budget_clears_clock would refuse to start if it were
  # below 12000 x 3.
  timeout_seconds: 36000
