# C3 — the hybrid steelman: one claude-opus-5 lead delegating to two
# gpt-5.6-luna workers, over one Buzz channel.
#
# This is the topology most people actually build — "smart expensive brain,
# cheap hands" — so keeping one cell of it means the study argues against the
# real alternative, not a straw one. Against the all-luna team (tb-team-3luna)
# it isolates what the expensive lead buys; against solo Opus (tb-solo-opus) it
# asks whether wrapping the frontier model in a team of cheap workers beats just
# running the frontier model alone.
#
# The lead accumulates the most context in a hierarchy — it reads every worker
# report — so this puts the expensive model in the single most token-heavy seat.
# That is deliberate: it is the honest, unfavourable-to-our-thesis version of the
# hybrid, and if the all-luna team still competes with it on $/solved-task, that
# is the result worth publishing.
#
# Mixed-model, so both price rows are load-bearing and the two provider ROUTES
# differ: the luna workers go to the OpenAI `/responses` gateway path, the Opus
# lead to `/ai-gateway/anthropic/v1/messages` (Opus 5 does not speak
# `/responses`). buzz-agent's `databricks_v2` provider selects the route per
# model automatically from the endpoint name — see tb-solo-opus.yaml for the
# detail. Nothing here needs to know about it; the endpoint names do the work.
#
# Replaces the earlier Sol-lead hybrid (tb-team-sol-luna.yaml, condition
# tb-team-sol-2luna): the study now uses Opus 5 as the expensive model in every
# mixed setting, keeping Sol only as a solo baseline (tb-solo-sol).
#
# Endpoint names are exact Databricks serving-endpoint names; provider/host/key
# resolve via testbed/endpoints/databricks-live.json.
schema_version: "1"
condition: tb-team-opus-2luna
roster:
  - id: orch
    kind: orchestrator
    # `lead` is read verbatim by worker.md: "Your lead is the teammate whose Role
    # column reads `lead`". Renaming it means every report @mentions nobody, the
    # sends all report success, and the trial stalls to its timeout with no error.
    role: lead
    count: 1
    endpoint: databricks-claude-opus-5
    model_revision: claude-opus-5
    prompt:
      # Byte-identical to the file tb-team-3luna.yaml pins, so the lead's
      # instructions are not a variable between the all-luna and hybrid team
      # conditions — only the lead's model is.
      path: personas/bench/lead-delegate.md
      sha256: 82df9751aeb5235f7122adc06bafdde12084181b0be84b91721e0d1b5e4a14f7

  - id: worker
    kind: worker
    role: implementer
    count: 2
    endpoint: databricks-gpt-5-6-luna
    model_revision: gpt-5.6-luna
    prompt:
      path: personas/bench/worker.md
      sha256: 7b3332e3d3da384a7c242c1aa34e90a063e7152ddf6de69f8a4e7e4a0b710726

prices:
  # Reference list prices — Opus from doc 02 §2.1 (`anthropic/claude-opus-5`),
  # luna the same figures every other luna condition carries. Opus is 5x luna on
  # input and cache-read but ~4.17x on output; see tb-solo-opus.yaml for the
  # cache-write (cache_creation) surcharge caveat, which matters most on the
  # lead's high-context seat. See tb-solo-luna.yaml for why cache_read_rate is
  # 0.0 (DB10).
  databricks-claude-opus-5:
    input_per_million_usd: 5.0
    cached_input_per_million_usd: 0.5
    output_per_million_usd: 25.0
    cache_read_rate: 0.0
  databricks-gpt-5-6-luna:
    input_per_million_usd: 1.0
    cached_input_per_million_usd: 0.1
    output_per_million_usd: 6.0
    cache_read_rate: 0.0
trial_budget:
  # Identical to every other condition in the comparison set (12000s longest task
  # x 3x multiplier). benchmark.py's check_budget_clears_clock refuses to start if
  # this drops below that product; a different value would mean this condition ran
  # on a different clock than the baselines it is measured against.
  timeout_seconds: 36000
