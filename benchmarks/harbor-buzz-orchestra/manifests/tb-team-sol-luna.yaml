# Terminal-Bench team condition on the Databricks bring-up slate: one
# gpt-5.6-sol orchestrator + two gpt-5.6-luna workers over one Buzz channel.
#
# Paired with tb-solo-luna.yaml, this is the smallest pair that can say
# anything: same task set, same effort, one agent versus three. Note the
# orchestrator is a *different, more expensive* model, so the pair measures
# "cheap solo vs mixed team", not team shape in isolation — a same-model team
# condition is needed before attributing any delta to coordination.
#
# See tb-solo-luna.yaml for why context_window_tokens is 272000 and why
# max_output_tokens is 32000 rather than the model maximum.
schema_version: "1"
condition: tb-team-sol-2luna
roster:
  - id: orch
    kind: orchestrator
    role: lead
    count: 1
    endpoint: databricks-gpt-5-6-sol
    model_revision: gpt-5.6-sol
    prompt:
      path: personas/bench/lead-delegate.md
      sha256: 82df9751aeb5235f7122adc06bafdde12084181b0be84b91721e0d1b5e4a14f7
    generation:
      max_output_tokens: 32000
      context_window_tokens: 272000
  - id: worker
    kind: worker
    role: implementer
    count: 2
    endpoint: databricks-gpt-5-6-luna
    model_revision: gpt-5.6-luna
    prompt:
      path: personas/bench/worker.md
      sha256: 7b3332e3d3da384a7c242c1aa34e90a063e7152ddf6de69f8a4e7e4a0b710726
    generation:
      max_output_tokens: 32000
      context_window_tokens: 272000
prices:
  # Operator-supplied list prices, doc 04 §7. See tb-solo-luna.yaml for why
  # cache_read_rate is 0.0 (DB10).
  databricks-gpt-5-6-sol:
    input_per_million_usd: 5.0
    cached_input_per_million_usd: 0.5
    output_per_million_usd: 30.0
    cache_read_rate: 0.0
  databricks-gpt-5-6-luna:
    input_per_million_usd: 1.0
    cached_input_per_million_usd: 0.1
    output_per_million_usd: 6.0
    cache_read_rate: 0.0
trial_budget:
  # 36000 = the dataset's longest task (12000s) at the 3x timeout multiplier the
  # study runs with (DEFAULT_TIMEOUT_MULTIPLIER in scripts/benchmark.py). The two
  # are one setting in two files: benchmark.py refuses to start if this is the
  # smaller of the pair, because the harness would then cut a task short of the
  # deadline Harbor granted it and record a timeout the agent never hit. A flat
  # 900s did exactly that before the multiplier existed — 39 of the 89 tasks
  # allow more than 900s, and one live trial died at 905s against a task budget
  # of 1800s.
  timeout_seconds: 36000
