# B-tier peer pair: two gpt-5.6-luna agents on one channel, one driving and one
# navigating, served by the same OpenAI route as tb-solo-luna-openai.
#
# This is the controlled comparison the mixed-model team manifest cannot make.
# Against tb-solo-luna-openai it holds the model, the serving path, the price
# sheet, the generation settings and the trial budget fixed, and varies exactly
# one thing: how many agents share the container. Any delta in score, cost,
# tokens or wall-clock is attributable to the pairing itself.
#
# The driver is the orchestrator because the roster allows exactly one, and
# because the driver is the agent the harness must wake with the task and the
# only one permitted to publish `DONE:`. The navigator is read-only by persona,
# not by permission — both agents get the same tools and the same filesystem,
# so the write boundary is instruction-enforced and worth checking in the
# transcripts rather than assuming.
#
# Expect this to cost more than solo per task even where it scores the same:
# two agents, and every handoff re-sends context. That is the measurement, not
# a defect.
schema_version: "1"
condition: tb-peer-2luna-openai
roster:
  - id: driver
    kind: orchestrator
    role: driver
    count: 1
    endpoint: gpt-5.6-luna
    model_revision: gpt-5.6-luna
    prompt:
      path: personas/bench/peer-driver.md
      sha256: 4461b3b7e735b9cdf7c30646a6a54d6b429879c37ea3eb4c8b29b2daceaa7a1d
    generation:
      max_output_tokens: 32000
      context_window_tokens: 272000
  - id: navigator
    kind: worker
    # Read verbatim by both personas out of the "Your team" table — peer-driver
    # addresses `navigator` and peer-navigator addresses `driver`. Renaming
    # either role here silently breaks the pairing: the @mention resolves to
    # nobody, the send still reports success, and the trial stalls to timeout.
    role: navigator
    count: 1
    endpoint: gpt-5.6-luna
    model_revision: gpt-5.6-luna
    prompt:
      path: personas/bench/peer-navigator.md
      sha256: ec0758b9982cfc499af622be244919305a3b480dc06aa13b3389634efed8ea32
    generation:
      max_output_tokens: 32000
      context_window_tokens: 272000
prices:
  # PLACEHOLDER, identical to tb-solo-luna-openai's — carried over from the
  # Databricks list price for the same model and NOT checked against OpenAI's
  # published rates. Being wrong in the same direction for both conditions
  # makes the solo-versus-pair cost *ratio* sound, but no absolute dollar
  # figure from either may be reported until these are replaced.
  gpt-5.6-luna:
    input_per_million_usd: 1.0
    cached_input_per_million_usd: 0.1
    output_per_million_usd: 6.0
    cache_read_rate: 0.0
trial_budget:
  # Matches tb-solo-luna-openai exactly. A pair genuinely needs longer than a
  # solo agent — every handoff is a round trip — but giving it a larger budget
  # would confound the comparison, and this value does not bind anyway: Harbor
  # enforces each task's own `[agent] timeout_sec`, which tops out at 12000s
  # across Terminal-Bench 2.1. Both conditions therefore run against the task's
  # own clock, which is the only budget the comparison can honestly share.
  timeout_seconds: 12000
