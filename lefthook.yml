# Glob patterns below mirror the `changes` job's dorny/paths-filter groups in
# .github/workflows/ci.yml — keep the two in sync. Deliberate deviations:
# - The `.github/workflows/ci.yml` path CI adds to its `rust`/`mobile` filters
#   is omitted; a CI-workflow-only edit doesn't need a local test run.
# - `desktop-check`/`desktop-typecheck`/`desktop-test` don't trigger on `rust`
#   changes, though CI's Desktop Core job does. Those commands are pure TS
#   (biome + tsc + node:test) with no Rust dependency, so the extra trigger
#   would be spurious locally.
# - Deletion-only surface changes do not trigger local hooks: lefthook 2.1.x
#   drops deleted paths from push-file discovery (`extractFiles` existence
#   check, repository.go). CI's dorny/paths-filter catches deletions.
#   Deliberate — accepted, not worked around.
# - `commit-msg` has no glob: it rewrites the commit message, not files. Note
#   Git only runs it for `git commit` and `git merge` — other flows need their own
#   flag: `git rebase --signoff`, `git cherry-pick -s`.
pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: ["crates/**", "examples/countdown-bot/**"]
      run: just fmt
      stage_fixed: true
    desktop-tauri-fmt:
      glob: ["desktop/src-tauri/**"]
      run: just desktop-tauri-fmt
      stage_fixed: true
    desktop-fix:
      glob: ["desktop/**", "pnpm-lock.yaml"]
      exclude: ["desktop/src-tauri/**"]
      run: just desktop-fix
      stage_fixed: true
    web-fix:
      glob: ["web/**", "pnpm-lock.yaml"]
      run: just web-fix
      stage_fixed: true
    mobile-fix:
      glob: ["mobile/**"]
      run: just mobile-fix
      stage_fixed: true

# Appends the DCO Signed-off-by trailer the required "DCO Check" enforces.
# `--if-exists doNothing` makes it idempotent and preserves an existing
# sign-off (including `git commit -s` and a different signer's trailer).
commit-msg:
  commands:
    signoff:
      run: 'git interpret-trailers --if-exists doNothing --trailer "Signed-off-by: $(git var GIT_COMMITTER_IDENT | sed ''s/ [0-9]* [+-][0-9]*$//'')" --in-place {1}'

pre-push:
  parallel: true
  # Rust work is gated in CI, not here. `rust-tests` (`just test-unit`) and
  # `desktop-tauri-checks` (Tauri clippy + tests) both ran the SAME commands
  # the required "Unit Tests" and "Desktop Core" jobs run, so they gated
  # nothing a merge could skip -- they only moved the failure earlier. The
  # cost was not earlier: on a three-crate change in a fresh worktree,
  # `rust-tests` took 3099 seconds and `desktop-tauri-checks` 1275 on a
  # developer's machine, because every new worktree pays a cold Cargo compile
  # that CI's cached runners do not. Agents create worktrees constantly, so
  # this was an hour of a shared laptop per Rust push, for a check GitHub was
  # about to run anyway.
  #
  # The desktop steps below stay: they finish in seconds to a minute and catch
  # the breakage that actually reaches a push.
  commands:
    branch-skew:
      run: ./scripts/check-branch-skew.sh
    desktop-check:
      files: ./scripts/list-pre-push-files.sh
      glob: ["desktop/**", "pnpm-lock.yaml"]
      exclude: ["desktop/src-tauri/**"]
      run: just desktop-check
    desktop-typecheck:
      glob: ["desktop/**", "pnpm-lock.yaml"]
      exclude: ["desktop/src-tauri/**"]
      run: just desktop-typecheck
    desktop-test:
      files: ./scripts/list-pre-push-files.sh
      glob: ["desktop/**", "pnpm-lock.yaml"]
      exclude: ["desktop/src-tauri/**"]
      run: just desktop-test
    desktop-file-sizes:
      # The ratchet covers `desktop/src-tauri/src` as well as the frontend,
      # but the `desktop-check` hook above excludes `desktop/src-tauri/**`, so
      # a Rust-only change to the Tauri crate never reached it. Two oversized
      # files grew past their limits and landed on develop unchecked, and only
      # a later full `just ci` on develop found it. This entry is the missing
      # half: the same guard, on the paths the other hook skips.
      files: ./scripts/list-pre-push-files.sh
      glob: ["desktop/src-tauri/**"]
      run: just desktop-file-sizes
    mobile-test:
      files: ./scripts/list-pre-push-files.sh
      glob: ["mobile/**"]
      run: just mobile-test
