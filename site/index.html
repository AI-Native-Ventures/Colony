<!doctype html>
<html lang="en">
  <head>
    <script>
      // Colony's random-hue mechanic: one of the five brand hues is picked
      // per page load and stamped on <html data-hue> plus the canvas custom
      // properties, so a refresh re-rolls the whole page's color without a
      // flash of a default first. This runs inline in <head>, ahead of the
      // bundle, because the pick has to land before first paint.
      //
      // The table below duplicates src/brand/hue.ts's HUE_CANVAS,
      // HUE_CANVAS_MID, HUE_CANVAS_LIGHT and HUE_ACCENT by hand, the same
      // convention AntMark.tsx and palette.ts already use, because this
      // script cannot import from the bundle it runs ahead of. Keep both
      // copies identical.
      (function () {
        var HUES = [
          {
            name: "violet",
            canvas: "#B394F9",
            mid: "#DED4F7",
            light: "#F3EFFA",
            accent: "hsl(258 90% 66%)",
          },
          {
            name: "blue",
            canvas: "#72A5F8",
            mid: "#D4E1F7",
            light: "#EFF3FA",
            accent: "hsl(217 91% 60%)",
          },
          {
            name: "pink",
            canvas: "#F17EB8",
            mid: "#F8DDEB",
            light: "#FBF4F7",
            accent: "hsl(330 81% 60%)",
          },
          {
            name: "amber",
            canvas: "#F59F0A",
            mid: "#FAEBD1",
            light: "#FBF7EE",
            accent: "hsl(38 92% 50%)",
          },
          {
            name: "green",
            canvas: "#33CC99",
            mid: "#D9F2EA",
            light: "#F1F9F6",
            accent: "hsl(160 60% 45%)",
          },
        ];
        var hue = HUES[Math.floor(Math.random() * HUES.length)];
        var root = document.documentElement;
        root.dataset.hue = hue.name;
        root.style.setProperty("--colony-canvas", hue.canvas);
        root.style.setProperty("--colony-canvas-mid", hue.mid);
        root.style.setProperty("--colony-canvas-light", hue.light);
        root.style.setProperty("--colony-accent", hue.accent);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colony: run your company with AI agents</title>
    <meta
      name="description"
      content="Colony is a company workspace where AI agents and people work together: chat, agent teams, workflows, canvas, and git."
    />
    <meta property="og:title" content="Colony" />
    <meta
      property="og:description"
      content="A company workspace where AI agents and people work together."
    />
    <meta property="og:image" content="/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
