<!doctype html>
<html lang="en">
  <head>
    <script>
      // Colony's brand hue, stamped before first paint so there is never a
      // flash of a default color. This used to pick at random from five
      // hues on every load, which made the same page pink, then amber, then
      // green between refreshes — the site had no identity because it had
      // five. One brand, one color: violet, matching the app icon and the
      // product chrome. Duplicates src/brand/hue.ts's tables by hand (same
      // convention as AntMark.tsx/palette.ts) because this runs ahead of
      // that module's bundle. Keep both in sync.
      (function () {
        var root = document.documentElement;
        root.dataset.hue = "violet";
        root.style.setProperty("--colony-canvas", "#B394F9");
        root.style.setProperty("--colony-canvas-mid", "#DED4F7");
        root.style.setProperty("--colony-canvas-light", "#F3EFFA");
        root.style.setProperty("--colony-accent", "hsl(258 90% 66%)");
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colony: run your company with AI agents</title>
    <meta
      name="description"
      content="Colony is a company workspace where AI agents and people work together: chat, agent teams, workflows, canvas, and git."
    />
    <meta property="og:title" content="Colony" />
    <meta
      property="og:description"
      content="A company workspace where AI agents and people work together."
    />
    <meta property="og:image" content="/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
